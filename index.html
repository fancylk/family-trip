<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="山河明月行 · 中秋国庆一家五口自驾游 · 杭州-南京-洛阳-西安-三门峡 12天11晚，含语音讲解与酒店待办清单">
<meta name="theme-color" content="#1d2a3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山河明月行">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>山河明月行 · 中秋国庆家庭自驾游</title>
<style>
:root{
  --ink:#2b2620; --ink-soft:#6b6156; --ink-faint:#9a8f80;
  --paper:#f7f2e9; --card:#fffdf8; --line:#e8e0d2;
  --red:#b5432a; --red-soft:#f6e3da;
  --teal:#2c5f5d; --teal-soft:#e0edeb;
  --gold:#d99a2b; --gold-soft:#f8ecd3;
  --blue:#3d5a80; --blue-soft:#e4eaf3;
  --night:#1d2a3a; --night-2:#33465e;
  --r:16px; --shadow:0 2px 12px rgba(60,45,20,.06),0 1px 3px rgba(60,45,20,.05);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);line-height:1.7}
.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}

/* ---------- hero ---------- */
.hero{position:relative;background:linear-gradient(165deg,#1a2436 0%,#2c3e56 55%,#43546e 100%);color:#f5efe2;overflow:hidden;padding:0 0 26px}
.hero .stars{position:absolute;inset:0;pointer-events:none}
.hero .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
.hero .moon{position:absolute;right:8%;top:34px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff7dd,#f4d98b 58%,#e8b95a);box-shadow:0 0 60px 18px rgba(244,217,139,.35);animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero .mountains{position:absolute;bottom:-2px;left:0;right:0;height:70px;opacity:.5}
.hero-in{position:relative;max-width:760px;margin:0 auto;padding:46px 20px 0}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.2em;color:#e8cf9a;border:1px solid rgba(232,207,154,.45);padding:5px 14px;border-radius:99px;margin-bottom:18px}
.hero h1{font-size:34px;letter-spacing:.12em;font-weight:600;line-height:1.3}
.hero h1 small{display:block;font-size:14px;letter-spacing:.35em;font-weight:400;color:#cbb98f;margin-top:10px}
.route-line{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;margin:26px 0 6px;font-size:14px}
.route-line b{font-weight:600;color:#fff;position:relative;padding:0 2px}
.route-line .sep{color:#e8cf9a;padding:0 7px;font-size:12px;position:relative;top:-1px}
.route-line .sep::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#e8cf9a;margin-right:7px;vertical-align:2px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hero-meta span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(4px);padding:6px 14px;border-radius:99px;font-size:13px;color:#f0e8d5}

/* ---------- sticky tabs ---------- */
.tabs{position:sticky;top:0;z-index:50;background:rgba(247,242,233,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:760px;margin:0 auto;display:flex;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;padding:13px 16px;font-size:15px;color:var(--ink-faint);border-bottom:2.5px solid transparent;transition:.2s;white-space:nowrap}
.tab.on{color:var(--red);border-color:var(--red);font-weight:600}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:2px;animation:tw 2s infinite}

main{max-width:760px;margin:0 auto;padding:18px 16px 90px}

/* ---------- cards & shared ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(232,224,210,.6);padding:18px 18px}
.sec-title{display:flex;align-items:center;gap:10px;margin:26px 4px 14px;font-size:19px;font-weight:700;letter-spacing:.05em}
.sec-title .bar{width:5px;height:20px;border-radius:3px;background:linear-gradient(#d99a2b,#b5432a)}
.muted{color:var(--ink-soft)} .tiny{font-size:12.5px;color:var(--ink-faint)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--gold-soft);color:#8a6414}
.pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- overview ---------- */
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.ov-stat{background:var(--card);border-radius:14px;padding:14px 8px;text-align:center;border:1px solid rgba(232,224,210,.6)}
.ov-stat b{display:block;font-size:21px;color:var(--red);font-weight:700}
.ov-stat span{font-size:12px;color:var(--ink-faint)}
.ov-note{display:flex;gap:12px;padding:15px 16px;border-radius:14px;background:linear-gradient(135deg,#fdf8ec,#faf1dd);border:1px solid #eddfbe;font-size:13.5px;color:#7c641e;line-height:1.8}
.ov-note .ic{font-size:18px;flex:none}

/* ---------- route timeline ---------- */
.day-card{position:relative;margin:0 0 14px}
.day-head{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;user-select:none}
.day-badge{flex:none;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#b5432a,#8f3220);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;box-shadow:0 3px 8px rgba(181,67,42,.3)}
.day-badge small{font-size:10px;opacity:.85;letter-spacing:.1em}
.day-badge b{font-size:19px;font-weight:700}
.day-head .t{flex:1;min-width:0}
.day-head .t .d{font-size:12.5px;color:var(--ink-faint)}
.day-head .t .n{font-size:15.5px;font-weight:600;margin-top:1px}
.day-head .arrow{flex:none;color:var(--ink-faint);transition:.25s}
.day-card.open .arrow{transform:rotate(180deg)}
.day-body{display:none;padding:0 16px 16px 16px}
.day-card.open .day-body{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.seg{position:relative;display:flex;gap:12px;padding:10px 0 10px 2px}
.seg::before{content:"";position:absolute;left:19px;top:44px;bottom:-8px;width:2px;background:var(--line)}
.seg:last-child::before{display:none}
.seg-ic{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;z-index:1}
.seg.drive .seg-ic{background:var(--blue-soft)} .seg.visit .seg-ic{background:var(--teal-soft)}
.seg.meal .seg-ic{background:var(--red-soft)} .seg.rest .seg-ic{background:var(--gold-soft)}
.seg-ct{flex:1;min-width:0}
.seg-ct .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.seg-ct .h b{font-size:15px;font-weight:600}
.seg-ct .h .dur{font-size:11.5px;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.045);color:var(--ink-soft)}
.seg-ct p{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.seg-ct .tip{font-size:12.5px;color:#8a6414;background:#faf3e2;border-radius:9px;padding:6px 10px;margin-top:6px;line-height:1.65}

/* ---------- spots ---------- */
.city-h{display:flex;align-items:center;gap:10px;margin:24px 2px 12px}
.city-h .flag{font-size:20px}
.city-h b{font-size:17.5px;letter-spacing:.06em}
.city-h .cnt{font-size:12px;color:var(--ink-faint);background:var(--card);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.spot{margin-bottom:12px;overflow:hidden}
.spot-top{display:flex;gap:13px;align-items:flex-start;padding:16px 16px 12px;cursor:pointer}
.spot-emoji{flex:none;width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,#faf3e2,#f3e6c8)}
.spot-top .m{flex:1;min-width:0}
.spot-top .m .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spot-top .m .nm b{font-size:16.5px;font-weight:700}
.stars{color:#e0a93c;font-size:12px;letter-spacing:1px}
.spot-top .m .meta{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
.spot-top .m .meta i{font-style:normal;margin-right:10px}
.spot-top .m .desc{font-size:13px;color:var(--ink-soft);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spot-top .go{flex:none;color:var(--ink-faint);font-size:13px;margin-top:14px;transition:.2s}
.spot.open .go{transform:rotate(90deg)}
.spot-detail{display:none;border-top:1px dashed var(--line);padding:14px 16px 16px;background:#fffaf0}
.spot.open .spot-detail{display:block;animation:fade .3s}

/* ---------- audio player ---------- */
.player{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2c3e56,#43546e);border-radius:15px;padding:12px 14px;color:#f2ead8;box-shadow:0 4px 14px rgba(44,62,86,.28)}
.play-btn{flex:none;width:44px;height:44px;border-radius:50%;background:#e8b95a;color:#1d2a3a;display:flex;align-items:center;justify-content:center;transition:.15s}
.play-btn:active{transform:scale(.92)}
.play-btn svg{width:18px;height:18px;fill:#1d2a3a}
.play-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ptrack{flex:1;min-width:0}
.pbar{height:5px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;cursor:pointer}
.pbar .fill{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,#e8b95a,#f4d98b);transition:width .18s linear}
.ptime{display:flex;justify-content:space-between;font-size:11px;opacity:.85;margin-top:5px;font-variant-numeric:tabular-nums}
.pspeed{flex:none;font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:3px 9px;color:#f2ead8}
.script{font-size:14.5px;line-height:2;color:#4a4238;white-space:pre-wrap;padding:4px 2px 0;text-align:justify}

/* ---------- food & hotels ---------- */
.food{margin-bottom:11px}
.food .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.food .h b{font-size:15.5px}
.food .dishes{font-size:13px;color:var(--red);margin-top:7px}
.food .row{font-size:12.5px;color:var(--ink-faint);margin-top:5px}
.food .row i{font-style:normal;margin-right:12px}
.hotel-r{display:flex;gap:12px;margin-bottom:11px}
.hotel-r .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.hotel-r .m{flex:1;min-width:0}
.hotel-r .m b{font-size:15.5px}
.hotel-r .price{float:right;font-size:13px;color:var(--teal);font-weight:600}
.feat{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.feat span{font-size:11.5px;background:var(--gold-soft);color:#8a6414;padding:2px 9px;border-radius:6px}

/* ---------- checklist ---------- */
.prog{display:flex;align-items:center;gap:12px;padding:15px 16px;margin-bottom:14px}
.prog .bar{flex:1;height:9px;border-radius:5px;background:#eee5d3;overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#d99a2b,#b5432a);transition:width .4s}
.prog b{font-size:14px}
.todo-item{display:flex;gap:12px;padding:14px 15px;margin-bottom:10px;align-items:flex-start}
.todo-item.done{opacity:.62}
.todo-item.done .nm{text-decoration:line-through}
.cb{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #cfc4ae;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff}
.cb svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;fill:none;display:none}
.todo-item.done .cb{background:var(--teal);border-color:var(--teal)}
.todo-item.done .cb svg{display:block}
.todo-ct{flex:1;min-width:0}
.todo-ct .nm{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo-ct .sub{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
.todo-ct .sub i{font-style:normal;margin-right:12px}
.st{font-size:11.5px;padding:2.5px 9px;border-radius:99px;font-weight:600}
.st.todo{background:#f3e6c8;color:#9a7b1e} .st.booked{background:#d9e8e6;color:#2c5f5d} .st.paid{background:#dce9f7;color:#33567e} .st.cancel{background:#f0dede;color:#a04b3a}
.todo-ops{display:flex;gap:6px;margin-top:8px}
.todo-ops button{font-size:12px;color:var(--ink-faint);background:rgba(0,0,0,.045);padding:3.5px 11px;border-radius:8px;transition:.15s}
.todo-ops button:active{background:rgba(0,0,0,.1)}
.btn-add{width:100%;padding:13px;border:2px dashed #d5c9b2;border-radius:14px;color:var(--ink-faint);font-size:14px;transition:.15s}
.btn-add:active{border-color:var(--red);color:var(--red)}
.notice{padding:13px 15px;border-radius:13px;background:var(--red-soft);font-size:13px;color:var(--red);line-height:1.8;margin-bottom:10px}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(30,25,18,.45);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.mask.show{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px 30px;max-height:86vh;overflow-y:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:17px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal h3 button{font-size:24px;color:var(--ink-faint);line-height:1;padding:4px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;outline:none;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
.fld-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:13px;border-radius:13px;font-size:15.5px;font-weight:600;text-align:center;transition:.15s}
.btn.primary{background:linear-gradient(135deg,#b5432a,#8f3220);color:#fff;box-shadow:0 4px 12px rgba(181,67,42,.3)}
.btn.ghost{border:1.5px solid var(--line);color:var(--ink-soft);margin-top:9px}
.btn:active{transform:scale(.985)}
footer{text-align:center;padding:34px 20px 44px;color:var(--ink-faint);font-size:12.5px;line-height:2}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(40,35,26,.9);color:#fff;font-size:13.5px;padding:9px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:640px){
  .modal{border-radius:22px;margin:6vh auto 0;align-self:flex-start}
  .mask{align-items:flex-start;overflow-y:auto}
  .hero h1{font-size:40px}
}
/* ---------- PWA install ---------- */
.pwa-fab{position:fixed;right:16px;bottom:22px;z-index:80;display:none;align-items:center;gap:8px;background:linear-gradient(135deg,#b5432a,#8f3220);color:#fff;font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:99px;box-shadow:0 6px 18px rgba(181,67,42,.4);animation:fade .4s}
.pwa-fab.show{display:flex}
.pwa-fab:active{transform:scale(.95)}
.pwa-fab .x{flex:none;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:400}
.install-g{margin:0}
.install-g li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.75;color:var(--ink-soft)}
.install-g li:last-child{border-bottom:none}
.install-g li .ic{flex:none;font-size:17px}
.install-g li b{color:var(--ink)}
.dl-bar{height:8px;border-radius:5px;background:#eee5d3;overflow:hidden;margin-top:10px}
.dl-bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#d99a2b,#b5432a);transition:width .3s}
.sw-hint{display:flex;align-items:center;gap:7px;font-size:12px;color:#2c5f5d;background:var(--teal-soft);border-radius:9px;padding:7px 11px;margin-top:12px}
.sw-hint.ok{background:#e2f0e5}
/* ---------- spot detail page ---------- */
.sd-back{display:inline-flex;align-items:center;gap:6px;padding:10px 0;font-size:14px;color:var(--ink-soft)}
.sd-back:hover{color:var(--red)}
.sd-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.sd-header h2{font-size:22px;font-weight:700;letter-spacing:.02em}
.sd-meta{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px;font-size:13px;color:var(--ink-soft)}
.sd-meta i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.sd-player{width:100%;border-radius:14px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.1);margin-bottom:14px;background:#000}
.sd-player iframe{width:100%;height:200px;border:none;display:block}
.sd-player .lb{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:12.5px;font-weight:600;color:#fff}
.sd-player .lb.bili{background:#fb7299}
.sd-player .lb.douyin{background:#111}
.sd-player .lb.xhs{background:#ff2442}
.sd-nar{padding:14px 16px;border-radius:14px;background:#fffaf0;border:1px solid #eddfbe;font-size:14.5px;line-height:2;color:#4a4238;white-space:pre-wrap;text-align:justify;margin:14px 0}
</style>
</head>
<body>

<header class="hero">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <svg class="mountains" viewBox="0 0 760 70" preserveAspectRatio="none">
    <path d="M0,70 L90,28 L150,52 L235,12 L320,55 L420,25 L500,58 L590,20 L680,50 L760,30 L760,70 Z" fill="#141d2b"/>
  </svg>
  <div class="hero-in">
    <div class="hero-tag">🥮 中秋 · 国庆 · 全家自驾</div>
    <h1 class="serif">山河明月行<small>HANGZHOU → LUOYANG → XI'AN</small></h1>
    <div class="route-line" id="routeLine"></div>
    <div class="hero-meta">
      <span>📅 9月25日 – 10月6日</span>
      <span>🚗 12天11晚 · 约2700km</span>
      <span>👨‍👩‍👧 一家五口同行</span>
    </div>
  </div>
</header>

<nav class="tabs"><div class="tabs-in" id="tabs">
  <button class="tab on" data-t="overview">总览</button>
  <button class="tab" data-t="route">行程</button>
  <button class="tab" data-t="spots">景点 · 语音讲解</button>
  <button class="tab" data-t="food">美食住宿</button>
  <button class="tab" data-t="todo">预订待办<span class="dot" id="todoDot" style="display:none"></span></button>
</div></nav>

<main>
  <section id="p-overview"></section>
  <section id="p-route" style="display:none"></section>
  <section id="p-spots" style="display:none"></section>
  <section id="p-spot-detail" style="display:none"></section>
  <section id="p-food" style="display:none"></section>
  <section id="p-todo" style="display:none"></section>
</main>

<button class="pwa-fab" id="pwaFab" onclick="installApp()">
  <span>📲 装到桌面</span><span class="x" onclick="dismissFab(event)">✕</span>

const NAR={"nanjing-fuzimiao":"果果，我们到南京的夫子庙啦！你有没有闻到空气里香香的味道？那是秦淮河边小吃街传来的。今天可是中秋节，我们一家人要在一条一千多岁的河上赏月，这条河就叫秦淮河。\n\n先考你一个问题：你猜\"夫子\"指的是谁？对啦，就是孔子，两千五百多年前最了不起的老师。夫子庙，就是古代南京人拜孔子、上学读书的地方。它最早建在一千七百多年前的东晋，比爷爷的爷爷的爷爷还要老好多好多倍呢。\n\n再看河对岸那排高高的房子，那叫\"江南贡院\"，是古代中国最大的考场！最大的时候有两万零六百四十四间小隔间，就像两万多个小小的鸽子笼。考试的时候，每个考生要搬进一个不到两平方米的小隔间，吃喝拉撒睡都在里面，一考就是九天六夜！哦对了，唐伯虎、写《范进中举》的吴敬梓，还有画竹子特别有名的郑板桥，都在这里考过试。你现在的期末考试跟他们比，是不是幸福多啦？\n\n接下来是今晚最神奇的时刻。等月亮升起来，你注意看河上的文德桥。因为桥和河的角度刚刚好，中秋的月亮会把影子分成两半，桥这边半个，桥那边半个，两个半圆合在一起，像桥抱着一个月亮！这就是南京人说了几百年的\"文德桥上半边月\"。\n\n一会儿我们坐上画舫，就是那种挂着红灯笼的小木船。船慢慢开，两岸的灯笼一盏一盏亮起来，倒映在水里，就像有人把星星摘下来撒进了河里。一千年前，有个叫杜牧的大诗人也在这样的夜晚坐船经过，他写下了一句诗：\"烟笼寒水月笼沙，夜泊秦淮近酒家。\"意思是：烟雾轻轻罩着河水，月光温柔地铺在沙滩上，夜晚，我把小船停在秦淮河边。今晚，你和爸爸妈妈、爷爷奶奶，还有一千年前的大诗人，看到的是同一轮月亮哦。","nanjing-zhonghuamen":"果果，快看我们面前这座巨大的城墙城堡！它叫中华门，是六百多年前明朝人建的，古时候的名字更酷，叫\"聚宝门\"——聚集宝贝的门！\n\n先跟你说它的第一个宝贝：它有三道\"瓮城\"。什么叫瓮城呢？想象一个大瓮，就是装水的大缸。敌人如果攻破了第一道城门，冲进来会发现——咦？前面还有一道门！再冲破，前面还有一道！这时候，埋伏在城墙上的士兵就会从藏兵洞里冲出来，把城门一关，从四面八方向下射箭。敌人被困在城墙中间，就像掉进了大瓮里的小老鼠，这就叫\"瓮中捉鳖\"！\n\n第二个宝贝更神奇：整个城堡里有二十七个藏兵洞，打起仗来能藏下三千多名士兵！这些洞冬暖夏凉，平时还能当仓库存粮食。\n\n第三个宝贝是一个传说。传说当年建城门的时候，地基总是塌，怎么都打不牢。皇帝朱元璋听说江南首富沈万三家里有个聚宝盆，装什么都装不完，怎么挖都挖不走。于是皇帝跟沈万三\"借\"来了聚宝盆，埋在了城门下面当\"定地基\"的宝贝——从此城墙稳稳当当，再也不塌了！当然啦，这只是传说，不过\"聚宝门\"这个名字真的用了五百多年。\n\n再看看城墙上的砖头，每一块都刻着字！那是\"责任制\"：砖上写着谁做的砖、哪个官员检查的。如果砖质量不好一捏就碎，做砖的人和检查的官员都要受罚。所以六百年过去了，这些砖还结结实实的。你摸一摸，是不是比我们家的墙还硬？","luoyang-longmen":"果果，现在站在你面前的，是全世界最有名的石头艺术宝库之一——龙门石窟！一千五百多年前，古人在伊河边这两座大山所有的悬崖上，刻满了佛像，一共有两千三百多个洞窟，十万多尊佛像！十万尊是什么概念呢？如果一尊一尊数，不吃不睡也要数上好几天！\n\n先看脚下这条河，叫伊河。两边山崖像大门一样对着，所以这里叫\"伊阙\"。一千三百多年前，唐朝的女皇帝武则天来这里游玩，觉得这里风景太美了，就捐了两万贯脂粉钱——就是她买化妆品的钱——在山崖上开凿最大的那尊大佛！\n\n跟我走，马上你就能看到它了——卢舍那大佛！它的脸有四米多长，整尊佛像有十七米高，相当于四层楼那么高！你抬头看它的眼睛，是不是觉得不管你走到左边还是右边，它都在温柔地看着你？工匠们的手艺就这么神奇。传说它的脸是照着武则天四十多岁时的样子刻的，所以大家都叫它\"武则天的微笑\"，还有人叫它\"东方的蒙娜丽莎\"。\n\n再告诉你一个小任务：仔细找一找，很多小佛像只有两厘米高，就你的指甲盖那么大，密密麻麻刻在石壁上，像蜂巢一样，那叫\"万佛洞\"。你可以数一数，一排到底有多少尊？\n\n最后说说这些石窟是怎么来的。一千五百年前，北魏孝文帝把首都搬到洛阳，皇帝带头在山崖上刻大佛，贵族、商人、老百姓也跟着刻，有钱的刻大的，没钱的刻小的，就这样一刻就是四百多年！果果，你想想，没有起重机、没有电钻，古人就靠锤子和凿子，在坚硬的石头山上，刻出了一个佛的世界。这就是我们常说的\"坚持\"的力量吧。","luoyang-museum":"果果，你知道洛阳为什么叫\"十三朝古都\"吗？因为从夏朝开始，先后有十三个王朝在这里建都！这座洛阳博物馆，就是洛阳四千年家底的\"百宝箱\"。\n\n先看第一件宝贝——一只小小的铜酒杯。别看它小，它的年纪可有三千八百多岁！它出土于二里头遗址，是目前中国发现最早的青铜酒器之一，考古学家叫它\"华夏第一爵\"。\"爵\"就是古代喝酒的杯子。三千八百年前，我们的祖先就学会了把铜和锡熔在一起铸东西，这只小杯子就是那个时代的\"高科技产品\"。\n\n再看第二件——一只白白的、光溜溜的玉杯子，叫\"曹魏白玉杯\"。它是三国时期曹魏的，将近一千八百岁了。你猜它上面刻了什么花纹？什么都没有！就是简简单单一只杯子，但是玉质温润，造型流畅，越简单越显出它的贵气。就像有的小朋友扎扎实实练字，不描不画，反而写得最漂亮。\n\n第三件宝贝最好玩——唐三彩马。唐三彩是洛阳的名片，用黄、绿、白三种颜色烧出来的陶器，一千多年前唐朝的\"艺术品\"。马背上驮着货物，骆驼脖子上挂着铃铛，那是唐朝的商队走在\"丝绸之路\"上，从长安一路走到罗马做买卖。你听过\"丝绸之路\"吧？对，就是那条连接中国和西方的古代高速公路，洛阳就是重要的起点之一！\n\n最后给你留个任务：博物馆里有一只巨大的石头狮子，不对，准确说是\"石辟邪\"，是东汉时期的镇墓神兽，将近两米高，昂着头、张着翅膀，威风极了。等下发给你一张寻宝图，看谁先找到它！","luoyang-baimasi":"果果，我们到白马寺啦！这是佛教传入中国之后，朝廷修建的第一座寺院，快两千岁了，它的生日是东汉永平十一年，也就是公元六十八年。\n\n先讲它的名字是怎么来的，这可是一个精彩的故事。大约一千九百多年前，汉朝的皇帝汉明帝做了一个梦，梦见一个金人，头顶放着白光，绕着大殿飞。第二天他问大臣：这是什么神仙呀？有大臣说：西方有个圣人叫\"佛\"，陛下梦到的可能就是他！于是皇帝派了使者，一路向西去寻找佛法。使者走了好远好远，在今天阿富汗一带遇到了两位印度高僧。两位高僧用白马驮着佛经和佛像，跟着使者回到了洛阳。皇帝特别高兴，下令建寺院，为了纪念那匹辛苦驮经的白马，就把寺院叫作\"白马寺\"。你看山门前是不是真的有一匹石头马？那就是它的纪念雕像。\n\n白马寺还有两个\"第一\"：中国第一座佛塔——齐云塔，就在寺院东边；还有中国第一部汉文佛经，就是在这里翻译出来的。所以全中国的佛教徒都尊称它为\"祖庭\"，意思就是\"老祖宗的庭院\"。\n\n今天我还要给你看一个全国独一份的景观：白马寺里有一个\"国际佛殿区\"！里面有三座外国政府出钱盖的佛殿——泰国的金顶佛殿、缅甸的白塔佛殿、印度的圆顶佛殿。你一脚跨进去，就像瞬移到了东南亚！泰国殿金光闪闪，缅甸殿白得像雪，每个国家的建筑风格完全不一样。\n\n果果，记住这四个字的口诀：\"白马驮经\"。以后任何人问你白马寺的来历，你就把这个故事讲给他听！","luoyang-luoyi":"果果，欢迎来到洛邑古城！\"洛邑\"是洛阳古代的名字，这里有古塔、有小桥、有灯笼，还有满街穿汉服的哥哥姐姐，像不像穿越回了唐朝？\n\n先看那座最高的塔，叫文峰塔。很久很久以前，洛阳的读书人有个习惯：赶考之前，一定要来爬文峰塔，拜一拜塔里的神仙，祈求\"高中\"——就是考出好成绩。就像你们考试前，妈妈会跟你说\"加油\"一样，古人靠爬塔给自己打气。\n\n再看看周围的小铺子。那边有个爷爷在吹糖人：一勺糖稀在他的手里，三捏两捏就变成一只小兔子、一条龙，趁热吹一口气，糖人就鼓起来啦！那边还有剪纸的阿姨，一张红纸折几折，剪刀咔嚓咔嚓，打开就是一幅漂亮的窗花，中间还有一只凤凰！这些手艺都叫\"非物质文化遗产\"，就是一代一代师傅教徒弟，传了好几百年的绝活。最厉害的是，如果你认真看，你会发现每一个糖人、每一幅剪纸，都没有图纸，全在师傅的脑袋里和手上。\n\n对了，这里最出片的是穿汉服。你看那边的池塘、灯笼、飞檐，都是拍照的绝美背景。要不要咱们全家也租一套汉服，拍一张全家福？奶奶穿上唐装一定特别精神，你穿上小襦裙就是从画里走出来的小仙女！\n\n晚上灯笼全亮起来的时候，文峰塔的影子倒在水里，一阵风吹过，塔影和灯影一起晃啊晃，果果，这就是古人说的\"人间灯火\"呀。","luoyang-yingtianmen":"果果，快抬头看！眼前这座巨大的城门，是不是像一只大鸟展开翅膀？它叫应天门，是隋唐洛阳城皇宫的正南门，始建于隋朝大业元年，也就是公元六零五年，一千四百多年前，它就是全中国最高大上的城门！\n\n它最厉害的设计叫\"双向三出阙\"。你看城楼两边，像楼梯一样一层一层伸出去的部分，叫\"阙\"。三层出阙，是只有天子才能用的最高等级！古代没有电视没有照片，外国使臣从很远看到这座城门，腿就先软了半截——哇，大唐帝国，太气派了！\n\n这里发生过一件改变中国历史的大事。一千三百多年前，武则天——中国历史上唯一的女皇帝——就是在应天门上宣布登基称帝的！那时候她六十六岁。在男人当家的时代，一个女人靠自己的聪明和坚持当上了皇帝，把国家治理得井井有条。你看，女生认真起来，真的可以很了不起。\n\n应天门还是古代的\"庆典广场\"：皇帝在这里会见外国使臣、宣布大赦、举行盛大仪式，就像今天在广场上放礼花、开庆祝大会一样。\n\n现在到了晚上，重头戏来了——灯光秀！灯光打在巨大的城楼上，一会儿是金龙飞舞，一会儿是大唐的宫殿，一会儿是满天星河，城门变成了一块几百米宽的大屏幕！果果，一千四百年前的工匠建这座门用了好几年，今天的灯光师用一台电脑就能让它在夜色里\"活\"过来。古老和现代，在这里手拉手。准备好了吗？灯要亮咯！","xian-bingmayong":"果果，深呼吸——因为你即将见到\"世界第八大奇迹\"，秦始皇兵马俑！\n\n先讲它们是怎么被发现的，这个故事特别戏剧化。一九七四年春天，西安临潼的几位农民伯伯打井找水，挖着挖着，咣！挖出了一个陶土做的人头！他们吓了一跳，赶紧报告给政府。考古学家一来，激动坏了：地下埋着一支两千两百多年前的军队！原来这些农民挖到的，是秦始皇陵墓的陪葬坑。\n\n现在我们站的地方是一号坑，它有三百多米长、六十多米宽，比两个足球场还大！低头看，一排一排的陶俑站着，就像正在等将军检阅。这些俑全部和真人一样高，一号坑有六千多个，加上二、三号坑一共有八千多个！\n\n接下来是最好玩的部分：找不同！你仔细看他们的脸——有的颧骨高，有的下巴圆，有的有胡子，有的没胡子；有的戴头盔，有的扎发髻；连鞋底上的针脚都刻出来了！为什么？因为每个俑都是工匠一个一个手工做的，据说没有两张完全一样的脸。这在全世界都找不出第二份。\n\n再告诉你一个秘密：这些俑刚出土的时候，身上是有颜色的！粉红的脸、绿色的铠甲、彩色的战袍，特别鲜艳。但是它们在地下一埋两千年，一接触空气，颜色几分钟就卷曲脱落了。所以现在的考古学家挖得特别慢，就是等科技更发达了，能让颜色保存下来。\n\n还有，兵马俑只是秦始皇陵的\"门口保安\"哦。真正的秦始皇陵墓，就在西边一公里多，那里有一座巨大的土山，地宫到现在都没有打开。里面有什么宝贝？史书上说有江河大海，用水银做成的……果果，等你长大，说不定能看到地宫打开的那一天！","xian-dayanta":"果果，你知道《西游记》里的唐僧吗？眼前这座大雁塔，就是真正的\"唐僧\"——玄奘法师，亲手主持修建的！\n\n真实的玄奘，比电视里的唐僧厉害一百倍。一千三百多年前，他二十九岁，没有神通广大的徒弟保护，也没有白龙马，就自己一个人，偷偷从长安出发，一路向西！他翻过沙漠，那里白天热得像烤炉，晚上冷得像冰箱，上不见飞鸟，下不见走兽，他好几次渴得昏过去；他还翻过终年积雪的大雪山。整整走了十七年，五万多公里，终于从印度带回来六百五十七部佛经！\n\n回来之后，唐太宗为他修了这座大雁塔，专门存放经书。塔有七层，六十四米多高，全部用砖砌成，一千三百多年风吹雨打、好几次大地震，它都稳稳站着！古代西安最高的建筑就是它，在城里走到哪儿都能看到。\n\n那为什么叫\"大雁塔\"，不叫\"玄奘塔\"呢？玄奘自己在书里写过一个故事：印度有一座塔，传说庙里的和尚本来吃肉，有一天大雁飞过，一个和尚开玩笑说：今天没肉吃啦。话音刚落，领头的大雁竟然折翅掉了下来！和尚们又惊又愧，从此不再吃肉，还在大雁掉下的地方建了塔纪念。玄奘很感动，就把西安的塔也叫\"雁塔\"。\n\n古时候，考中进士的人会来大雁塔题上自己的名字，叫\"雁塔题名\"，是全家最大的荣耀！白居易考中的时候才二十七岁，是那批进士里最年轻的，他得意地写：\"慈恩塔下题名处，十七人中最少年。\"\n\n一会儿北广场还有音乐喷泉，水柱跟着音乐跳舞，最高能喷到六十米！","xian-datangbuyecheng":"果果，现在是晚上，我们走进大唐不夜城——这条街有两千一百米长，比咱们学校操场绕二十圈还长！全世界的步行街里，它是数一数二的\"巨无霸\"。\n\n抬头看！整条街的灯笼、城楼、飞檐全部亮着暖黄色的灯，一眼望不到头，是不是像走进了一个发光的梦里？一千三百年前，唐朝的首都长安就是全世界最大的城市，有一百多万人住在这里，晚上灯火通明，各国的人都来这里做买卖、留学。今天这条街，就是把\"盛唐\"重新点亮给你看。\n\n前面围了好多人，我们去看看——是\"不倒翁小姐姐\"！一位穿着唐朝裙子的大姐姐，站在一个巨大的不倒翁上，随着音乐旋转、摇摆，还会伸出手和观众轻轻牵手，一晚上要牵几百上千次！她的裙子转起来像一朵开的花。果果记住：观看的时候站稳扶好，牵到手的小朋友都说特别神奇！\n\n再往前，有\"盛唐密盒\"——两个扮成唐朝大臣的演员，会把游客请上台，玩古代的知识问答，答不上来的观众急得抓耳挠腮，全场哈哈大笑。街上还有\"李白\"，披着斗笠在灯下写诗，你要是能背一首他的诗，说不定他会送你一句祝福！\n\n这条街的尽头，就是我们白天去的大雁塔。你回头看看——灯光下的大雁塔静静地站在夜色里，塔是唐朝的，灯是今天的，一千三百年就这样手拉手。果果，来，我们全家在这儿拍张合影，把大唐的月亮装进照片里！","xian-shanxi-history":"果果，陕西历史博物馆有一句超级口号，叫\"给我一天，还你万年\"。今天，我们就要在这座大宝库里，从一百多万年前一直逛到一千多年前！\n\n第一站，看一只杯子——镶金兽首玛瑙杯。它是用一整块带花纹的玛瑙雕成的，杯子的一头雕成牛头兽面，头顶两只角，金色的帽子上镶着。这只杯子是唐朝的宝贝，全中国就这么一只，国家规定它永远不许出国展览！它还是丝绸之路的见证——这种造型来自波斯，也就是古代的伊朗，说明一千多年前长安城里住着好多外国商人。\n\n第二件，一只银壶——鎏金舞马衔杯纹银壶。壶身上刻着一匹骏马，嘴里衔着一只酒杯，正在跳舞！史书上说，唐玄宗过生日时，养了一百匹会跳舞的马，音乐一响，马儿踏着节拍起舞，最后嘴里衔着酒杯向皇帝祝寿。后来战乱，这些马流落军中，它们一听军乐响起就习惯性跳舞，士兵们吓坏了，以为马疯了……从此这门绝技就失传了。要不是这只银壶，谁会相信马会衔杯祝寿呢？\n\n第三件，一方玉印章——\"皇后之玺\"。它是汉朝皇后吕后的印章，用整块新疆和田玉雕的，只有乒乓球那么大，却是目前发现的唯一一枚汉代皇后玉玺！它还是一个放学的小学生，在路边的水渠边捡到的哦——所以走路要看着点儿，说不定宝贝就在脚边！\n\n最后压轴：独孤信的煤精组印。这个人超厉害，是中国历史上著名的\"岳父\"，三个女儿分别嫁给了不同朝代的皇帝！他有二十六面体的一枚印章，其中十四个面刻着不同的官职——因为他一个人兼任了八个官！大家笑称他是\"中国古代第一兼职狂人\"。","xian-citywall":"果果，我们脚下这道城墙，绕西安城一圈，全长十三点七四公里！如果沿着墙顶走一整圈，等于走了将近三个半的体育课长跑。它是中国现存最大、保存最完整的古代城墙，六百五十多岁了！\n\n它建于一三七零年，明朝洪武年间。你知道它为什么这么结实吗？古人把糯米熬成粥，和黄土、石灰拌在一起夯筑，像给城墙灌了\"强力胶\"，黏性特别强，比很多水泥还结实，这就是传说中的\"糯米城墙\"。六百多年了，大炮轰过、地震摇过，它还稳稳地站着。\n\n墙顶宽十二到十四米，宽到可以并排跑好几辆车！古人守城的时候，士兵在墙顶上跑马、运石头、放箭。每隔一段就有一座凸出墙外的\"敌楼\"，士兵躲在里面站岗放哨；每个凸出去的\"马面\"，能让守军从三面夹攻爬墙的敌人——就像下棋，提前算好了每一步！\n\n咱们从永宁门，也就是南门登城。永宁门是西安的\"迎宾第一门\"，好多重要的欢迎仪式都在这里举行。傍晚的时候最美：一边是城里钟楼的飞檐和回民街飘来的香味，一边是城外高楼的霓虹灯。太阳落山，城墙的灯笼亮起来，砖缝里都是金色的光。\n\n果果，考你一个数学题：城墙每隔一百二十米就有一座敌楼，全城一共有九十八座！你数数看，从我们脚下到那个拐角有几座？数对了，晚上加一个肉夹馍！","xian-huiminjie":"果果，闻到了吗？孜然烤肉的香味！这里是回民街，西安最香的街道！它其实不是一条街，而是一大片回族爷爷奶奶、叔叔阿姨世世代代居住的老街区，住了上千年，所以大家叫它\"回坊\"。\n\n先说怎么吃才地道。主街是给游客逛的，真正的美味都藏在旁边的巷子里：大皮院、洒金桥。跟我来！\n\n第一站，羊肉泡馍。它可不是一碗普通的汤面，是一场\"仪式\"！服务员会给你两张死面饼，你要自己动手，把饼掰成黄豆大小的碎块。掰得越小越均匀，汤才进得去味儿。然后把掰好的馍交给后厨，大师傅加上羊肉汤、粉丝、羊肉片，滚两滚端上来。吃的时候配一碟糖蒜解腻。这个掰馍的活儿最适合你啦，慢慢掰，掰得好的馍，吃起来的口感一级棒！\n\n第二站，肉夹馍。白吉饼烤得外脆里软，剁碎的腊汁肉肥瘦相间，咬一口，肉汁顺着手流。陕西人叫它\"中式汉堡\"，但它比汉堡早出生好几百年！\n\n第三站，甜品——东南亚甑糕。不是东南亚的糕哦，是因为老板的店名带\"东南亚\"三个字。它是糯米和红枣、云豆蒸的，一层一层，枣泥甜糯，趁热吃最好。\n\n对了，这附近还有一座化觉巷大清真寺，是中式院落和伊斯兰风格的混搭，院子深处藏着好几百年的老建筑，安安静静的，跟外面热闹的美食街完全是两个世界。\n\n给你的小任务：吃一样你没见过的西安小吃，然后回来告诉大家它像什么！","sanmenxia-hangu":"果果，欢迎来到函谷关！我先念一句超酷的话：\"一夫当关，万夫莫开！\"说的就是这里。为什么一个关口这么厉害？你看两边的山：高高的大山中间，只有一条窄窄的深沟可以通过，这条沟像刀劈出来的一样，深得像盒子。\"函\"就是盒子的意思，\"关在谷中，深险如函\"，所以叫函谷关。古代打仗，谁守住这条沟，谁就掐住了东西往来的脖子！\n\n两千多年前，这里是秦国的东大门。发生过好多有名的故事。\"鸡鸣狗盗\"听过吗？齐国的孟尝君被秦国扣住了，他想办法逃到函谷关，可关口规定：鸡叫了才开门！当时是半夜，怎么办？他手下有个随从学起了公鸡打鸣，\"喔喔喔——\"周围的鸡都跟着叫，守关的人迷迷糊糊就把门开了，孟尝君顺利逃走！是不是像电影情节？\n\n但函谷关最最重要的故事，是一个老人和一本书。两千五百年前，守关的长官叫尹喜。有一天清晨，他站在关楼上，看见东边的天上飘来一大片紫色的云气。尹喜懂天文，他知道：紫气东来，必有圣人过关！果然，一位白发老人骑着青牛，慢慢悠悠来了——他就是老子，当时天下最有智慧的人。尹喜连忙拦住他：\"先生这么有学问，能不能留下一本书再走？\"老子就住下来，写了五千个字，然后骑牛出关，从此再也没有人见过他。\n\n这五千个字，就是《道德经》！\"道可道，非常道\"，还有你以后会学到的\"千里之行，始于足下\"，都是这本书里的。全世界印刷量最大的书之一，就诞生在我们脚下的这道山谷里！果果，记住六个字：紫气东来，青牛出关。","sanmenxia-dikengyuan":"果果，现在我要带你去看全中国最神奇的村庄！我先说三句顺口溜，你听听看有多奇怪：\"见树不见村，进村不见人，闻声不见人。\"树是看得见的，村子在哪儿呢？人说话听得见，人在哪儿呢？\n\n答案马上揭晓——地底下！跟我到这个院子看看：先走下一条斜坡，咦？我们竟然站在了一个大方坑的坑底！抬头看，天是方方的一块，像不像住在井里？坑的四壁，凿着一间一间拱顶的屋子，冬暖夏凉，这就是\"地坑院\"，当地人叫\"天井窑院\"。\n\n古人为什么住在地下呢？因为这里的黄土又深又结实，直立性特别好，挖出来的洞几十年都不塌。而且地下可舒服啦：冬天外面零下几度，屋里十几度，暖烘烘；夏天外面暴晒，屋里凉凉的，都不用开空调！这种住法已经用了四千多年，从远古的穴居一直传到爷爷奶奶那辈，全世界只有这一片黄土高原上有，被称为\"人类居住的活化石\"。\n\n再告诉你一个地坑院的聪明设计：每个院子中间都会种一棵树。猜猜为什么？第一，树冠露出地面，远处的人一看：咦，地上有树，树底下有人家！就不会掉进坑里啦。第二，夏天树荫把院子遮得凉凉的。你说古人聪明不聪明？\n\n还有排水：院子的角落有一个深深的水井，雨水流进去，存起来用；坑的边沿还砌着一圈矮矮的挡水墙，防止雨水灌进屋里。四千年前没有工程师学校，老百姓靠动脑子，把地下房子住得安安稳稳。\n\n一会儿我们就在地坑院里吃\"十大碗\"，吃完还能看剪纸、皮影戏。果果，别忘了给同学讲讲：我住过\"地下的四合院\"！","sanmenxia-swan":"果果，清早的天鹅湖，是我们这趟旅行最安静、最舒服的地方。你听——风吹芦苇的沙沙声，还有水鸟扑翅膀的声音。\n\n先说实话：白天鹅大部队一般要十月下旬、十一月才飞到，我们来得早了一点，可能只能看到几只\"先头部队\"。但是没关系，这片湿地本身就很美，而且我要给你讲讲天鹅的故事，等你看懂了它们，就会觉得每一只都很珍贵。\n\n每年秋天，白天鹅从遥远的西伯利亚出发，飞几千公里来三门峡过冬。你猜它们为什么要选这里？三个原因：第一，三门峡大坝拦住了黄河，冬天这一段水不结冰，天鹅随时能喝到水、找到吃的；第二，水里有它们爱吃的水草根和小鱼小虾；第三，这里的人特别爱它们——三门峡人把天鹅当宝贝，几十年前冬天食物少的时候，渔民们会自发撒玉米喂天鹅。所以天鹅年年都回来，越来越多，三门峡就成了有名的\"天鹅之城\"。\n\n再告诉你几个天鹅的冷知识：第一，天鹅是游泳高手但起飞很费劲，要像飞机一样在水面上助跑好几米才能飞起来；第二，小天鹅是灰色的，毛茸茸像个灰面团，要长到一岁多才变成白色；第三，天鹅是一夫一妻，认定了就一辈子在一起，比好多人类都长情！\n\n果果，我们轻轻地沿着栈道走，别大声喊，别扔东西。看，那边水草里有白鹭，一伸脖子就叼起一条小鱼！如果你带望远镜了，往远处看：芦苇荡边上是不是有几个白点？说不定就是天鹅的侦察兵。等天鹅满湖的季节，我们再来一次，好不好？","sanmenxia-guoguo":"果果，我要先考你两个成语：\"唇亡齿寒\"和\"假道伐虢\"。不会没关系，看完这座博物馆，你就永远记住了！\n\n两千七百年前，这里有一个国家，叫虢国，都城就在三门峡。它的隔壁有两个国家：虞国和晋国。晋国想吞并虢国，但中间隔着虞国。于是晋国送给虞国国君好多宝马美玉，说：\"借条路，让我去打虢国呗。\"虞国大夫宫之奇急忙劝阻：\"虢国和虞国就像嘴唇和牙齿，嘴唇没了，牙齿就要挨冻！晋国灭了虢国，回来顺手就能灭了咱们！\"可惜虞国国君贪财，还是借了路。晋国灭掉虢国，回来的路上，果然顺手把虞国也灭了——宝马美玉，又物归原主。这就是\"假道伐虢\"和\"唇亡齿寒\"的故事，全部发生在我们脚底下这片土地上！\n\n一九五六年，考古学家在这里发现了虢国国君和王后的墓地，挖出了三万多件文物！现在博物馆就建在墓地原址上，我们待会儿会踩着玻璃栈道，低头就能看到两千七百年前的车马坑——真的马骨头、真的车轮，一排一排，特别震撼！这个车马坑比西安的兵马俑还早五百多年！\n\n最后看镇馆之宝——\"中华第一剑\"！它是一把玉柄铁剑：剑柄是玉的，剑身是铁的。别看它短短的、锈得不起眼，它把中国人工冶铁的历史往前推了将近两百年！在它之前，大家以为中国人那时候还不会炼铁呢。果果，历史书就是这样，一铲子下去，有时候就要改写一页。","sanmenxia-daba":"果果，轰隆隆听到了吗？这就是黄河！我们脚下这座大坝，叫三门峡大坝，是新中国在黄河上建的第一座大坝，一九五七年开工，被称为\"万里黄河第一坝\"。\n\n先说说\"三门峡\"这个名字怎么来的。你看眼前的河道，古代这里横着几座大石头岛，把黄河分成三股急流，人们给它们起了名字：人门、神门、鬼门。船家只有走\"人门\"才安全，闯\"神门\"\"鬼门\"九死一生。传说这三道石门还是大禹治水时，抡起斧头劈开的！大禹的爸爸治水用\"堵\"，越堵越淹；大禹用\"疏\"，把水引出去，成功了。这个故事你肯定听过——它就发生在这条河上！\n\n再看大坝下面激流中间，立着一根高高的石柱，任凭黄河水冲了几千年，它岿然不动！它就是\"中流砥柱\"！古时候没有雷达、没有导航，船工老远看见它，就知道：过了最险的地方，安全了！所以它成了\"精神偶像\"——后来人们用\"中流砥柱\"形容在困难面前顶天立地、不屈服的人。果果，你愿意做这样的人吗？\n\n再考你一个知识：黄河为什么叫\"黄\"河？因为它每年裹着好多好多泥沙，是全世界含沙量最大的河，古时候的人说\"黄河斗水，泥居其七\"。三门峡大坝有一个重要任务，就是拦住泥沙、防洪、发电。\n\n最后，风好大呀——你看坝上的风把妈妈的丝巾吹成旗子啦！黄河在脚下滚滚向东，这就是\"黄河之水天上来，奔流到海不复回\"！","hefei-xiaoyaojin":"果果，回程的路上，我们在合肥歇一晚。别小看这个小公园——逍遥津，它可是一场三国大战的\"战场遗址\"！\n\n一千八百多年前，三国时期，东吴的孙权亲自带十万大军，来攻打曹操的地盘合肥。当时守合肥的曹魏大将叫张辽，手下只有七千人。十万对七千，怎么打？张辽挑了八百个最勇猛的士兵，趁天刚亮，吴军还在睡懒觉，突然杀进大营！张辽大喊着自己的名字冲在最前面，吴军一下子全乱了阵脚。孙权围着城打了很多天打不下来，撤退的时候还差点被张辽抓住，马都跳过了断桥才逃掉！这一仗就是有名的\"张辽威震逍遥津\"，《三国演义》里写得可精彩啦。\n\n后来这场仗太有名了，连民间看孩子的大妈都用它吓唬小孩：\"张辽来了，别哭了！\"江东的小孩一听\"张辽\"两个立刻不哭——你看，一员猛将能当\"止哭神器\"，比什么方法都灵！\n\n逍遥津这个名字也很美：\"逍遥\"就是自由自在，\"津\"是渡口。古时候这里是淝水上的一个渡口，后来成了达官贵人游船赏景的地方。现在它是合肥市中心最舒服的公园，有古树、有湖、有游船。\n\n明天一早我们就出发回杭州啦。十二天，四座古城，两千多公里。果果，这一路你看了大佛、兵马俑、大城门、大黄河，还吃了泡馍和水席——今晚做个好梦，梦里再走一遍！","sanmenxia-huashan":"果果，坐稳了——我们要坐全世界最长的高山索道，飞上华山！\n\n索道车厢慢慢升起来，你回头看，山下的汽车越来越小，像小蚂蚁一样。这个索道叫西峰索道，全长四千二百米，比四十个足球场连起来还长！从山脚到山顶，爬升了一千三百米——相当于把四百层楼竖起来，然后坐电梯上去！单程要二十五分钟，是全世界最长的登山索道之一。\n\n华山为什么叫\"奇险天下第一山\"呢？你往窗外看——那些陡峭的山崖像刀削过一样，直上直下，这就是华山的\"险\"。古人没有索道，要在悬崖上凿出石阶手脚并用地爬上去，一爬就是五六个小时。所以古话说\"自古华山一条路\"，意思是只有一条险路能上去，没有别的选择。\n\n现在到了山顶！走出索道站，这里就是西峰。西峰又叫\"莲花峰\"，因为山顶有一块巨大的石头，形状像莲花的花瓣。你站在山顶往下看，山下的黄河像一条细细的带子，那些房子像火柴盒一样小。山顶的风吹过来，把所有的烦恼都吹走了。\n\n告诉你一个秘密：金庸爷爷写的武侠小说里，各大门派的高手每年都要在华山比武，叫\"华山论剑\"。山顶上真的有一块\"华山论剑\"的石碑，好多游客在那里拍照假装自己是武林高手呢！\n\n最后考你一个问题：华山有五个主峰——东峰、西峰、南峰、北峰和中峰。我们坐索道上来的是西峰。你猜\"东峰\"上有什么？是看日出的最佳位置！很多人凌晨就开始爬，赶在太阳出来前到东峰顶，看太阳从云海里跳出来——那画面，比任何动画片都震撼。不过我们今天坐索道就够了，日出嘛，下次再来！"};

function embedVideo(id,platform,encodedName){
  const name=decodeURIComponent(encodedName);
  const c=$("#vid-"+id);
  if(!c)return;
  if(c.style.display==="block"&&c.dataset.platform===platform){c.style.display="none";return}
  let src="",msg="";
  if(platform==="bili"){
    const bvid=BILI_VIDS[id];
    if(bvid){src=`https://player.bilibili.com/player.html?bvid=${bvid}&autoplay=false&high_quality=1`}
    else{window.open("https://search.bilibili.com/all?keyword="+encodedName+"%20旅游攻略","_blank");return}
  }else if(platform==="douyin"){
    src=`https://www.douyin.com/search/${encodedName}`;
    msg="抖音页面可能无法直接嵌入，部分浏览器会显示空白。";
  }else if(platform==="xhs"){
    src=`https://www.xiaohongshu.com/search_result?keyword=${encodedName}`;
    msg="小红书页面可能无法直接嵌入，部分浏览器会显示空白。";
  }
  c.innerHTML=`<iframe src="${src}" style="width:100%;height:210px;border:none;border-radius:12px" allowfullscreen sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>${msg?`<div style="padding:6px 12px;text-align:center;font-size:12px;color:var(--ink-faint)">${msg}</div>`:""}`;
  c.style.display="block";c.dataset.platform=platform;
}
function toggleSpot(id){const el=$("#spot-"+id);el.classList.toggle("open");
  if(el.classList.contains("open")&&!audios[id]){const a=new Audio("audio/"+id+".mp3");a.preload="none";
    a.addEventListener("timeupdate",()=>{const f=$("#pf-"+id);if(f)f.style.width=(a.currentTime/a.duration*100||0)+"%";const t=$("#pt-"+id);if(t)t.textContent=fmt(a.currentTime);const dd=$("#pd-"+id);if(dd&&a.duration)dd.textContent=fmt(a.duration)});
    a.addEventListener("ended",()=>{setPlayIcon(id,false)});
    audios[id]=a;}}
function setPlayIcon(id,playing,loading){const b=$("#pl-"+id+" .play-btn");if(!b)return;
  b.classList.toggle("loading",!!loading);
  b.innerHTML=loading?`<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7z"/></svg>`:playing?`<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>`:`<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`}
function playAudio(id){const a=audios[id]||(()=>{toggleSpot(id);return audios[id]})();
  if(a.paused){Object.entries(audios).forEach(([k,x])=>{if(k!==id&&!x.paused){x.pause();setPlayIcon(k,false)}});
    if(a.readyState===0)setPlayIcon(id,false,true);
    a.addEventListener("canplay",()=>setPlayIcon(id,true),{once:true});
    a.play().catch(()=>toast("音频加载失败，请稍后再试"));setPlayIcon(id,true);
  }else{a.pause();setPlayIcon(id,false)}}
function seekBar(e,id){const a=audios[id];if(!a||!a.duration)return;const r=e.currentTarget.getBoundingClientRect();a.currentTime=(e.clientX-r.left)/r.width*a.duration}
function cycleSpeed(id){const s=[1,1.25,1.5,0.75];speeds[id]=((speeds[id]??0)+1)%s.length;const v=s[speeds[id]];if(audios[id])audios[id].playbackRate=v;$("#ps-"+id).textContent=v.toFixed(2).replace(/0+$/,"").replace(/\.$/,"")+".x"}
function toggleScript(id){const s=$("#sc-"+id);s.style.display=s.style.display==="none"?"block":"none"}
function fmt(t){if(!isFinite(t))return"00:00";const m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}

/* =============== TODO (editable, localStorage) =============== */
const LS="trip_hotels_v4";
let TODOS=JSON.parse(localStorage.getItem(LS)||"null")||JSON.parse(JSON.stringify(DEF_TODOS));
const ST_MAP={todo:["todo","未预订"],booked:["booked","已预订 ✔"],paid:["paid","已付款 💰"],cancel:["cancel","已取消"]};
function saveTodos(){localStorage.setItem(LS,JSON.stringify(TODOS));renderTodo()}
function renderTodo(){
  const done=TODOS.filter(t=>t.st==="booked"||t.st==="paid").length;
  $("#todoDot").style.display=(done<TODOS.length)?"":"none";
  $("#p-todo").innerHTML=`
  <div class="sec-title" style="margin-top:8px"><span class="bar"></span>📋 预订待办清单 <span class="tiny" style="font-weight:400">改动自动保存在本机</span></div>
  <div class="card prog"><b class="serif">${done}/${TODOS.length}</b><div class="bar"><i style="width:${TODOS.length?done/TODOS.length*100:0}%"></i></div><span class="tiny">已预订</span></div>
  <div class="notice">💡 点卡片左侧圆圈切换状态；点「编辑」修改酒店名称、日期、价格和备注——换酒店就改成你订的那家。数据存在你手机里，换设备可截图分享。</div>
  ${TODOS.map((t,i)=>{
    const[cls,label]=ST_MAP[t.st]||ST_MAP.todo;const isDone=t.st==="booked"||t.st==="paid";
    return `<div class="card todo-item ${isDone?"done":""}">
    <div class="cb" onclick="cycleSt(${i})"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
    <div class="todo-ct">
      <div class="nm">${esc(t.nm)}<span class="st ${cls}">${label}</span></div>
      <div class="sub"><i>📅 ${esc(t.sub)}</i>${t.price&&t.price!=="—"?`<i>💰 ${esc(t.price)}</i>`:""}</div>
      ${t.note?`<div class="tiny" style="margin-top:4px;color:#8a6414">💡 ${esc(t.note)}</div>`:""}
      <div class="todo-ops"><button onclick="editTodo(${i})">✏️ 编辑</button><button onclick="delTodo(${i})">🗑 删除</button></div>
    </div></div>`}).join("")}
  <button class="btn-add" onclick="editTodo(-1)">＋ 添加新待办</button>
  <button class="btn ghost" style="margin-top:10px" onclick="resetTodo()">↺ 恢复默认清单</button>`;
}
function cycleSt(i){const o=["todo","booked","paid","cancel"];TODOS[i].st=o[(o.indexOf(TODOS[i].st)+1)%o.length];saveTodos()}
function delTodo(i){if(confirm("确定删除「"+TODOS[i].nm+"」？")){TODOS.splice(i,1);saveTodos();toast("已删除")}}
function resetTodo(){if(confirm("恢复默认清单？你的修改将丢失。")){TODOS=JSON.parse(JSON.stringify(DEF_TODOS));saveTodos();toast("已恢复默认")}}
function editTodo(i){
  const t=i>=0?TODOS[i]:{nm:"",sub:"",price:"",note:"",st:"todo"};
  $("#modal").innerHTML=`<h3>${i>=0?"编辑待办":"新增待办"}<button onclick="closeModal()">×</button></h3>
  <div class="fld"><label>名称（酒店/事项）</label><input id="f-nm" value="${esc(t.nm)}" placeholder="如：洛阳华阳广场国际大饭店 家庭房"></div>
  <div class="fld-2">
    <div class="fld"><label>日期 / 说明</label><input id="f-sub" value="${esc(t.sub)}" placeholder="如：9/26-9/28 连住3晚"></div>
    <div class="fld"><label>价格</label><input id="f-price" value="${esc(t.price)}" placeholder="如：500-800/晚"></div>
  </div>
  <div class="fld"><label>备注</label><textarea id="f-note" rows="2" placeholder="选填：注意事项、订单号等">${esc(t.note)}</textarea></div>
  <div class="fld"><label>状态</label><select id="f-st">${Object.entries(ST_MAP).map(([k,v])=>`<option value="${k}" ${t.st===k?"selected":""}>${v[1]}</option>`).join("")}</select></div>
  <button class="btn primary" onclick="saveTodo(${i})">保存</button>`;
  $("#mask").classList.add("show");
}
function saveTodo(i){
  const t={nm:$("#f-nm").value.trim(),sub:$("#f-sub").value.trim(),price:$("#f-price").value.trim(),note:$("#f-note").value.trim(),st:$("#f-st").value};
  if(!t.nm){toast("名称不能为空");return}
  if(i>=0)TODOS[i]=t;else TODOS.push(t);
  saveTodos();closeModal();toast("已保存 ✓");
}

/* =============== PWA INSTALL =============== */
let deferredPrompt=null, pwaDismissed=localStorage.getItem("pwa_dismiss")==="1";
function isStandalone(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}
function maybeShowFab(){
  if(isStandalone()||pwaDismissed)return;
  setTimeout(()=>$("#pwaFab").classList.add("show"),2500);
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;maybeShowFab()});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;$("#pwaFab").classList.remove("show");toast("已安装到桌面 🎉")});
function dismissFab(e){if(e)e.stopPropagation();localStorage.setItem("pwa_dismiss","1");pwaDismissed=true;$("#pwaFab").classList.remove("show")}
function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null});return}
  openInstallGuide();
}
function openInstallGuide(){
  const ua=navigator.userAgent;
  const isMiui=/MiuiBrowser|XiaoMi|MIUI/i.test(ua), isWeChat=/MicroMessenger/i.test(ua), isIOS=/iPhone|iPad/i.test(ua);
  const isMobile=/Android|iPhone|iPad|Mobile/i.test(ua), isMac=/Macintosh/i.test(ua);
  $("#modal").innerHTML=`<h3>📲 安装${isMobile?"到手机桌面":"为桌面应用"}<button onclick="closeModal()">×</button></h3>
  <ul class="install-g">
    ${isWeChat?`<li><span class="ic">💬</span><div><b>当前在微信内打开，先退出这一步：</b><br>点右上角 <b>「···」</b> → 选择 <b>「在浏览器打开」</b>（或复制链接到系统浏览器），再按下面小米的步骤操作。</div></li>`:""}
    <li><span class="ic">📱</span><div><b>小米 / 红米（系统浏览器）</b><br>点浏览器底部 <b>「☰ 菜单」</b> → <b>「添加到桌面」</b>（澎湃OS 可能在「更多工具」里）→ 确认。桌面出现「山河明月行」图标，点开即为全屏应用。</div></li>
    ${!isMiui&&!isIOS?`<li><span class="ic">🌐</span><div><b>手机 Chrome / 夸克 / Edge</b><br>菜单 <b>「⋮」</b> → <b>「安装应用 / 添加到主屏幕」</b>。</div></li>`:""}
    ${isIOS?`<li><span class="ic">🍏</span><div><b>iPhone / iPad（Safari）</b><br>底部分享按钮 <b>「⇧」</b> → <b>「添加到主屏幕」</b>。</div></li>`:""}
    ${!isMobile?`<li><span class="ic">💻</span><div><b>Mac / Windows · Chrome / Edge</b><br>点击地址栏右侧的 <b>「安装」图标（屏幕+箭头）</b>，或菜单 <b>「⋮」→「安装山河明月行…」</b> → 弹窗点「安装」。应用出现在启动台/Dock，独立窗口运行、离线可用。</div></li>
    <li><span class="ic">🖥️</span><div><b>Mac · Safari（17+）</b><br>菜单栏 <b>「文件」→「添加到程序坞」</b>。</div></li>`:""}
    <li><span class="ic">💡</span><div>安装后无地址栏、像原生 App 一样${isMobile?"全屏":"独立窗口"}；<b>没网也能用</b>（见下方离线包）。</div></li>
  </ul>
  <button class="btn primary" style="margin-top:14px" onclick="cacheAllAudio(this)">⬇️ 预下载全部语音讲解（约15MB · 离线可用）</button>
  <div class="dl-bar"><i id="dlFill"></i></div>
  <div class="sw-hint" id="dlStatus"><span>📶</span><span>出发前在有 Wi-Fi 的地方点一次，路上（尤其三门峡山区）没信号也能放讲解。</span></div>`;
  $("#mask").classList.add("show");
  checkCached();
}
async function checkCached(){
  if(!("caches" in window))return;
  const c=await caches.open("trip-audio-v1");
  const keys=await c.keys();
  const audio=keys.filter(k=>k.url.includes("/audio/")).length;
  if(audio>=19){const s=$("#dlStatus");if(s){s.className="sw-hint ok";s.innerHTML="<span>✅</span><span>语音离线包已就绪（19/19），没网也能听。</span>"}}
  return audio;
}
async function cacheAllAudio(btn){
  btn.disabled=true;btn.textContent="正在下载…";
  const c=await caches.open("trip-audio-v1");
  const ids=SPOTS.map(s=>s.id);
  let ok=0;
  for(let i=0;i<ids.length;i++){
    try{const r=await fetch(`audio/${ids[i]}.mp3`);if(r.ok){await c.put(`audio/${ids[i]}.mp3`,r);ok++}}catch(e){}
    const f=$("#dlFill");if(f)f.style.width=((i+1)/ids.length*100)+"%";
    const st=$("#dlStatus");if(st&&!st.classList.contains("ok"))st.innerHTML=`<span>⬇️</span><span>下载中 ${i+1}/${ids.length}…</span>`;
  }
  if(ok===ids.length){const s=$("#dlStatus");s.className="sw-hint ok";s.innerHTML=`<span>✅</span><span>语音离线包已就绪（${ok}/${ids.length}），没网也能听。</span>`;btn.textContent="✅ 已就绪，全程离线可用";toast("离线包完成 🎉")}
  else{btn.disabled=false;btn.textContent="重试下载";toast(`完成 ${ok}/${ids.length}，可重试`)}
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").then(()=>maybeShowFab()).catch(()=>maybeShowFab());
}else maybeShowFab();
</script>

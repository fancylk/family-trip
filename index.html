<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="山河明月行 · 中秋国庆一家五口自驾游 · 杭州-南京-洛阳-西安-三门峡 12天11晚，含语音讲解与酒店待办清单">
<meta name="theme-color" content="#1d2a3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="山河明月行">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>山河明月行 · 中秋国庆家庭自驾游</title>
<style>
:root{--keyboard-inset:0px;
  --ink:#2b2620; --ink-soft:#6b6156; --ink-faint:#9a8f80;
  --paper:#f7f2e9; --card:#fffdf8; --line:#e8e0d2;
  --red:#b5432a; --red-soft:#f6e3da;
  --teal:#2c5f5d; --teal-soft:#e0edeb;
  --gold:#d99a2b; --gold-soft:#f8ecd3;
  --blue:#3d5a80; --blue-soft:#e4eaf3;
  --night:#1d2a3a; --night-2:#33465e;
  --r:16px; --shadow:0 2px 12px rgba(60,45,20,.06),0 1px 3px rgba(60,45,20,.05);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);line-height:1.7}
.serif{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}

/* ---------- hero ---------- */
.hero{position:relative;background:linear-gradient(165deg,#1a2436 0%,#2c3e56 55%,#43546e 100%);color:#f5efe2;overflow:hidden;padding:0 0 18px}
.hero .stars{position:absolute;inset:0;pointer-events:none}
.hero .star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
.hero .moon{position:absolute;right:8%;top:34px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff7dd,#f4d98b 58%,#e8b95a);box-shadow:0 0 60px 18px rgba(244,217,139,.35);animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero .mountains{position:absolute;bottom:-2px;left:0;right:0;height:70px;opacity:.5}
.hero-in{position:relative;max-width:760px;margin:0 auto;padding:30px 20px 0}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.2em;color:#e8cf9a;border:1px solid rgba(232,207,154,.45);padding:5px 14px;border-radius:99px;margin-bottom:12px}
.hero h1{font-size:34px;letter-spacing:.12em;font-weight:600;line-height:1.3}
.hero h1 small{display:block;font-size:14px;letter-spacing:.35em;font-weight:400;color:#cbb98f;margin-top:10px}
.route-line{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;margin:18px 0 4px;font-size:14px}
.route-line b{font-weight:600;color:#fff;position:relative;padding:0 2px}
.route-line .sep{color:#e8cf9a;padding:0 7px;font-size:12px;position:relative;top:-1px}
.route-line .sep::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#e8cf9a;margin-right:7px;vertical-align:2px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero-meta span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(4px);padding:6px 14px;border-radius:99px;font-size:13px;color:#f0e8d5}

/* ---------- sticky tabs ---------- */
.tabs{position:sticky;top:0;z-index:50;background:rgba(247,242,233,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:760px;margin:0 auto;display:flex;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 14px;font-size:15px;color:var(--ink-faint);border-bottom:2.5px solid transparent;transition:.2s;white-space:nowrap}
.tab.on{color:var(--red);border-color:var(--red);font-weight:600}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:2px;animation:tw 2s infinite}

main{max-width:760px;margin:0 auto;padding:12px 16px 42px}

/* ---------- cards & shared ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(232,224,210,.6);padding:14px 16px}
.sec-title{display:flex;align-items:center;gap:10px;margin:18px 4px 10px;font-size:19px;font-weight:700;letter-spacing:.05em}
.sec-title .bar{width:5px;height:20px;border-radius:3px;background:linear-gradient(#d99a2b,#b5432a)}
.muted{color:var(--ink-soft)} .tiny{font-size:12.5px;color:var(--ink-faint)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--gold-soft);color:#8a6414}
.pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- overview ---------- */
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ov-stat{background:var(--card);border-radius:14px;padding:11px 7px;text-align:center;border:1px solid rgba(232,224,210,.6)}
.ov-stat b{display:block;font-size:21px;color:var(--red);font-weight:700}
.ov-stat span{font-size:12px;color:var(--ink-faint)}
.ov-note{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#fdf8ec,#faf1dd);border:1px solid #eddfbe;font-size:13.5px;color:#7c641e;line-height:1.8}
.ov-note .ic{font-size:18px;flex:none}

/* ---------- route timeline ---------- */
.day-card{position:relative;margin:0 0 14px}
.day-head{display:flex;align-items:center;gap:13px;padding:15px 16px;cursor:pointer;user-select:none}
.day-badge{flex:none;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#b5432a,#8f3220);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;box-shadow:0 3px 8px rgba(181,67,42,.3)}
.day-badge small{font-size:10px;opacity:.85;letter-spacing:.1em}
.day-badge b{font-size:19px;font-weight:700}
.day-head .t{flex:1;min-width:0}
.day-head .t .d{font-size:12.5px;color:var(--ink-faint)}
.day-head .t .n{font-size:15.5px;font-weight:600;margin-top:1px}
.day-head .arrow{flex:none;color:var(--ink-faint);transition:.25s}
.day-card.open .arrow{transform:rotate(180deg)}
.day-body{display:none;padding:0 16px 16px 16px}
.day-card.open .day-body{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.seg{position:relative;display:flex;gap:12px;padding:10px 0 10px 2px}
.seg::before{content:"";position:absolute;left:19px;top:44px;bottom:-8px;width:2px;background:var(--line)}
.seg:last-child::before{display:none}
.seg-ic{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;z-index:1}
.seg.drive .seg-ic{background:var(--blue-soft)} .seg.visit .seg-ic{background:var(--teal-soft)}
.seg.meal .seg-ic{background:var(--red-soft)} .seg.rest .seg-ic{background:var(--gold-soft)}
.seg-ct{flex:1;min-width:0}
.seg-ct .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.seg-ct .h b{font-size:15px;font-weight:600}
.seg-ct .h .dur{font-size:11.5px;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.045);color:var(--ink-soft)}
.seg-ct p{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
.seg-ct .tip{font-size:12.5px;color:#8a6414;background:#faf3e2;border-radius:9px;padding:6px 10px;margin-top:6px;line-height:1.65}

/* ---------- spots ---------- */
.city-h{display:flex;align-items:center;gap:10px;margin:18px 2px 8px}
.city-h .flag{font-size:20px}
.city-h b{font-size:17.5px;letter-spacing:.06em}
.city-h .cnt{font-size:12px;color:var(--ink-faint);background:var(--card);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.spot{margin-bottom:9px;overflow:hidden}
.spot-top{display:flex;gap:13px;align-items:flex-start;padding:13px 14px 9px;cursor:pointer}
.spot-emoji{flex:none;width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,#faf3e2,#f3e6c8)}
.spot-top .m{flex:1;min-width:0}
.spot-top .m .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spot-top .m .nm b{font-size:16.5px;font-weight:700}
.stars{color:#e0a93c;font-size:12px;letter-spacing:1px}
.spot-top .m .meta{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
.spot-top .m .meta i{font-style:normal;margin-right:10px}
.spot-top .m .desc{font-size:13px;color:var(--ink-soft);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spot-top .go{flex:none;color:var(--ink-faint);font-size:13px;margin-top:14px;transition:.2s}
.spot.open .go{transform:rotate(90deg)}
.spot-detail{display:none;border-top:1px dashed var(--line);padding:14px 16px 16px;background:#fffaf0}
.spot.open .spot-detail{display:block;animation:fade .3s}
.spot-city-nav{display:flex;gap:7px;overflow-x:auto;padding:0 2px 4px;margin:-2px 0 12px;scrollbar-width:none}
.spot-city-nav::-webkit-scrollbar{display:none}
.spot-city-nav a{flex:none;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--teal);font-size:13px;text-decoration:none}
.spot-city-nav a span{font-size:11px;color:var(--ink-faint)}
.spot-guide{display:grid;gap:6px;margin-top:9px}
.spot-guide>div{display:grid;grid-template-columns:53px 1fr;gap:6px;align-items:start;font-size:12.5px;line-height:1.65;color:var(--ink-soft)}
.spot-guide b{font-weight:600;color:var(--teal)}
.spot-guide-detail{margin:14px 0}
.spot-guide-detail>div{grid-template-columns:62px 1fr;font-size:13.5px;line-height:1.75;padding:7px 0;border-bottom:1px dashed var(--line)}
.spot-guide-detail>div:last-child{border-bottom:none}

/* ---------- audio player ---------- */
.player{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2c3e56,#43546e);border-radius:15px;padding:12px 14px;color:#f2ead8;box-shadow:0 4px 14px rgba(44,62,86,.28)}
.play-btn{flex:none;width:44px;height:44px;border-radius:50%;background:#e8b95a;color:#1d2a3a;display:flex;align-items:center;justify-content:center;transition:.15s}
.play-btn:active{transform:scale(.92)}
.play-btn svg{width:18px;height:18px;fill:#1d2a3a}
.play-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ptrack{flex:1;min-width:0}
.pbar{height:5px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;cursor:pointer}
.pbar .fill{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,#e8b95a,#f4d98b);transition:width .18s linear}
.ptime{display:flex;justify-content:space-between;font-size:11px;opacity:.85;margin-top:5px;font-variant-numeric:tabular-nums}
.pspeed{flex:none;font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:3px 9px;color:#f2ead8}
.script{font-size:14.5px;line-height:2;color:#4a4238;white-space:pre-wrap;padding:4px 2px 0;text-align:justify}

/* ---------- food & hotels ---------- */
.food{margin-bottom:11px}
.food .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.food .h b{font-size:15.5px}
.food .dishes{font-size:13px;color:var(--red);margin-top:7px}
.food .row{font-size:12.5px;color:var(--ink-faint);margin-top:5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.food .row i{font-style:normal;margin-right:12px}
/* ---------- 高德一键导航 ---------- */
.nav-chip{display:inline-flex;align-items:center;gap:3px;font-style:normal;text-decoration:none;color:var(--teal);background:var(--teal-soft);padding:2.5px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;vertical-align:1px}
.nav-chip:active{opacity:.6}
.seg-nav{margin-left:auto;flex:none;display:inline-flex;align-items:center;font-style:normal;text-decoration:none;color:var(--teal);background:var(--teal-soft);padding:1.5px 10px;border-radius:99px;font-size:11.5px;font-weight:600;cursor:pointer}
.seg-nav:active{opacity:.6}
.seg-meta{font-size:12px;color:var(--teal);background:var(--teal-soft);border-radius:8px;padding:4px 10px;margin-top:6px;display:inline-block}
.meal-day{padding:14px 16px;margin-bottom:12px}
.meal-day .mh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.meal-day .mh b{font-size:16px;color:var(--red)}
.meal-day .mh span{font-size:12.5px;color:var(--ink-faint)}
.meal-row{display:flex;gap:10px;padding:8px 0;border-top:1px dashed var(--line);align-items:flex-start}
.mic{flex:none;width:54px;text-align:center;font-size:12px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:8px;padding:4px 0;margin-top:2px}
.mm{flex:1;min-width:0}
.mm>b{font-size:14.5px}
.mp{margin-left:8px;font-size:12px;color:var(--red);font-weight:600}
.hotel-r{display:flex;gap:12px;margin-bottom:11px}
.hotel-r .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.hotel-r .m{flex:1;min-width:0}
.hotel-r .m b{font-size:15.5px}
.hotel-r .price{float:right;font-size:13px;color:var(--teal);font-weight:600}
.feat{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.feat span{font-size:11.5px;background:var(--gold-soft);color:#8a6414;padding:2px 9px;border-radius:6px}

/* ---------- checklist ---------- */
.prog{display:flex;align-items:center;gap:12px;padding:15px 16px;margin-bottom:14px}
.prog .bar{flex:1;height:9px;border-radius:5px;background:#eee5d3;overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#d99a2b,#b5432a);transition:width .4s}
.prog b{font-size:14px}
.todo-item{display:flex;gap:12px;padding:14px 15px;margin-bottom:10px;align-items:flex-start}
.todo-item.done{opacity:.62}
.todo-item.done .nm{text-decoration:line-through}
.cb{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #cfc4ae;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff}
.cb svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;fill:none;display:none}
.todo-item.done .cb{background:var(--teal);border-color:var(--teal)}
.todo-item.done .cb svg{display:block}
.todo-ct{flex:1;min-width:0}
.todo-ct .nm{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.todo-ct .sub{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
.todo-ct .sub i{font-style:normal;margin-right:12px}
.st{font-size:11.5px;padding:2.5px 9px;border-radius:99px;font-weight:600}
.st.todo{background:#f3e6c8;color:#9a7b1e} .st.booked{background:#d9e8e6;color:#2c5f5d} .st.paid{background:#dce9f7;color:#33567e} .st.cancel{background:#f0dede;color:#a04b3a}
.todo-ops{display:flex;gap:6px;margin-top:8px}
.todo-ops button{font-size:12px;color:var(--ink-faint);background:rgba(0,0,0,.045);padding:3.5px 11px;border-radius:8px;transition:.15s}
.todo-ops button:active{background:rgba(0,0,0,.1)}
.btn-add{width:100%;padding:13px;border:2px dashed #d5c9b2;border-radius:14px;color:var(--ink-faint);font-size:14px;transition:.15s}
.btn-add:active{border-color:var(--red);color:var(--red)}
.notice{padding:13px 15px;border-radius:13px;background:var(--red-soft);font-size:13px;color:var(--red);line-height:1.8;margin-bottom:10px}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(30,25,18,.45);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.mask.show{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px 30px;max-height:min(86vh,calc(100vh - var(--keyboard-inset) - 16px));margin-bottom:var(--keyboard-inset);overflow-y:auto;animation:up .25s;transition:max-height .18s ease,margin-bottom .18s ease;scroll-padding-bottom:24px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:17px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
footer{text-align:center;padding:22px 20px 28px;color:var(--ink-faint);font-size:12.5px;line-height:2}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;outline:none;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
.fld-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:13px;border-radius:13px;font-size:15.5px;font-weight:600;text-align:center;transition:.15s}
.btn.primary{background:linear-gradient(135deg,#b5432a,#8f3220);color:#fff;box-shadow:0 4px 12px rgba(181,67,42,.3)}
.btn.ghost{border:1.5px solid var(--line);color:var(--ink-soft);margin-top:9px}
.btn:active{transform:scale(.985)}
footer{text-align:center;padding:34px 20px 44px;color:var(--ink-faint);font-size:12.5px;line-height:2}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(40,35,26,.9);color:#fff;font-size:13.5px;padding:9px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:640px){
  .modal{border-radius:22px;margin:6vh auto var(--keyboard-inset);max-height:min(86vh,calc(100vh - var(--keyboard-inset) - 6vh - 16px));align-self:flex-start}
  .mask{align-items:flex-start;overflow-y:auto}
  .hero h1{font-size:40px}
}
/* ---------- PWA install ---------- */
.pwa-fab{position:fixed;right:16px;bottom:22px;z-index:80;display:none;align-items:center;gap:8px;background:linear-gradient(135deg,#b5432a,#8f3220);color:#fff;font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:99px;box-shadow:0 6px 18px rgba(181,67,42,.4);animation:fade .4s}
.pwa-fab.show{display:flex}
.pwa-fab:active{transform:scale(.95)}
.pwa-fab .x{flex:none;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:400}
.install-g{margin:0}
.install-g li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.75;color:var(--ink-soft)}
.install-g li:last-child{border-bottom:none}
.install-g li .ic{flex:none;font-size:17px}
.install-g li b{color:var(--ink)}
.dl-bar{height:8px;border-radius:5px;background:#eee5d3;overflow:hidden;margin-top:10px}
.dl-bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#d99a2b,#b5432a);transition:width .3s}
.sw-hint{display:flex;align-items:center;gap:7px;font-size:12px;color:#2c5f5d;background:var(--teal-soft);border-radius:9px;padding:7px 11px;margin-top:12px}
.sw-hint.ok{background:#e2f0e5}
/* ---------- spot detail page ---------- */
.sd-back{display:inline-flex;align-items:center;gap:6px;padding:10px 0;font-size:14px;color:var(--ink-soft)}
.sd-back:hover{color:var(--red)}

function distKm(a,b){if(!POI[a]||!POI[b])return null;const[x1,y1]=POI[a][1].split(",").map(Number),[x2,y2]=POI[b][1].split(",").map(Number);const r=Math.PI/180,R=6371;const q=Math.sin((y2-y1)*r/2)**2+Math.cos(y1*r)*Math.cos(y2*r)*Math.sin((x2-x1)*r/2)**2;return +(2*R*Math.asin(Math.sqrt(q))).toFixed(1)}
function renderDayMeals(){$("#day-meals").innerHTML=DAY_MEALS.map(d=>`
<div class="card meal-day">
  <div class="mh"><b class="serif">DAY ${d.d}</b><span>${d.date} · ${d.city}</span></div>
  ${d.meals.map(m=>{
    const anchor=m.a||d.anchor;
    const dist=(m.k&&POI[m.k]&&POI[anchor])?distKm(anchor,m.k):null;
    const bits=[];
    if(dist!=null&&dist<30)bits.push("距住宿点约"+dist+"km");
    if(m.k&&m.k.indexOf("sa-")===0&&dist==null)bits.push("高速途中");
    return `<div class="meal-row"><span class="mic">${m.t}</span><div class="mm"><b>${m.n}</b>${m.p&&m.p!=="—"?`<span class="mp">人均¥${m.p}</span>`:""}${m.k?navChip(m.k,"seg-nav"):""}${m.note?`<div class="tiny">${bits.length?bits.join(" · ")+" · ":""}${m.note}</div>`:""}</div></div>`;
  }).join("")}

function segNavKey(s){return s[0]==="drive"?(DRV_NAV[s[2]]||null):(SEG_NAV[s[2]]||null)}
function segMetaHtml(s){const mt=SEG_META[s[2]];if(!mt)return"";
  const bits=[];
  if(mt.mode!=="walk"&&mt.p!=null)bits.push("距上站 "+mt.p+"km");
  if(mt.h!=null&&mt.h<=100)bits.push((mt.lbl||"距酒店")+" "+mt.h+"km");
  const tail=mt.mode==="walk"?"🚶 建议步行约"+(mt.wm||mt.pm)+"分钟":mt.mode==="transit"?"🚕 建议公交/打车":"🚗 建议驾车约"+mt.pm+"分钟";
  return `<div class="seg-meta">🧭 ${bits.join(" · ")} · ${tail}</div>`}
function amapUrl(ll,name){
  return ll?`https://uri.amap.com/navigation?to=${ll},${encodeURIComponent(name)}&mode=car&src=shanheyuexing&coordinate=gaode&callnative=1`
          :`https://uri.amap.com/search?keyword=${encodeURIComponent(name)}&src=shanheyuexing&callnative=1`}
/* 渲染期生成原生链接：用户手势直接跳转，不受弹窗拦截影响 */
function navChip(k,cls,label){const p=POI[k];if(!p)return"";
  return `<a class="${cls||"nav-chip"}" href="${amapUrl(p[1],p[0])}" target="_blank" rel="noopener" onclick="navGo(event,'${k}')">🧭 ${label||"导航"}</a>`}
/* 移动端直接调起高德App进入导航（可直接投车机），不经网页；
   App未装或唤起失败时1.5s后回落高德网页版；桌面端维持网页版路线规划 */
function navGo(e,k){
  if(!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent))return;
  const p=POI[k];if(!p||!p[1])return;
  e.preventDefault();
  const ll=p[1].split(","), iOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  const app=(iOS?"iosamap":"androidamap")+"://navi?sourceApplication=shanheyuexing&poiname="+encodeURIComponent(p[0])+"&lat="+ll[1]+"&lon="+ll[0]+"&dev=0&style=0";
  const t=setTimeout(()=>{if(!document.hidden)location.href=amapUrl(p[1],p[0])},1500);
  const cancel=()=>clearTimeout(t);
  window.addEventListener("pagehide",cancel,{once:true});
  document.addEventListener("visibilitychange",function h(){if(document.hidden){cancel();document.removeEventListener("visibilitychange",h)}});
  location.href=app;
}

const NAR={"nanjing-fuzimiao":"乐乐，我们到南京夫子庙啦！你有没有闻到空气里香香的味道？那是秦淮河边小吃街飘来的。今天可是中秋节，我们一家人要在一条一千多岁的河上赏月，这条河就是大名鼎鼎的秦淮河。\n先考你一个问题：你猜\"夫子\"指的是谁？对啦，就是孔子，两千五百多年前最了不起的老师。夫子庙就是古代南京人拜孔子、读书学习的地方。可是你知道吗？在古代，女孩子是不允许进考场考试的！而现在你不但能读书，还能想学什么就学什么——所以乐乐，你可比古代的公主厉害多啦。\n旁边的江南贡院，是古代中国最大的考场，里面有整整两万零六百四十四间小隔间，像两万多个小小的鸽子笼。考生要在一个不到两平方米的小隔间里吃住九天六夜，吃喝拉撒全在里面，考完出来腿都麻了。他们的笔墨纸砚、干粮水壶全都自带，是不是比现在的考试辛苦一百倍？\n河对岸还有一条 famous 的小巷子叫乌衣巷，唐朝大诗人刘禹锡为它写过诗：\"旧时王谢堂前燕，飞入寻常百姓家。\"意思是以前住在巷子里的王公贵族不见了，连燕子都飞到了普通人家的屋檐下。\n接下来是今晚最神奇的时刻。等月亮升起来，你盯着河上的文德桥看——中秋的月亮在桥两边各映出半个影子，合起来像桥抱着一个圆月亮，这就是说了几百年的\"文德桥上半边月\"。\n一会儿我们坐上挂红灯笼的画舫，小船慢慢开，一千年前的大诗人杜牧也在这样的夜晚写下\"夜泊秦淮近酒家\"。乐乐，你、爸爸妈妈、爷爷奶奶，还有一千年前的大诗人，看到的是同一轮月亮哦。小任务：在船上数一数，两岸你最多能同时看到多少盏红灯笼？","nanjing-zhonghuamen":"乐乐，快抬头看，眼前这座巨大的城墙城堡叫中华门！它是六百多年前明朝人建的，以前的名字更酷，叫\"聚宝门\"——聚集宝贝的门。\n它最厉害的本领是\"瓮中捉鳖\"。整座城门里藏着三道瓮城，就像三个大口袋。敌人要是攻破第一道门冲进来，会发现前面还有一道门；再冲破，还有一道！等敌人全部挤进来，城墙上的士兵把门一关，从四面八方往下射箭——敌人就像掉进大瓮里的小老鼠，插翅难逃。这就是成语\"瓮中捉鳖\"的活教材。\n城堡里还有二十七个藏兵洞，最多能藏三千名士兵。这些洞是用石头砌的，冬暖夏凉，士兵冬天待在里面比外面暖和多了，平时还能当仓库放粮食。\n这里还有一个特别有名的故事。传说建城门的时候，地基总是塌，怎么打都打不牢。皇帝朱元璋听说大富翁沈万三家里有个聚宝盆，放进去什么都变不完，就\"借\"来埋在了地基下面——从此城墙稳稳当当，再也不塌了！所以这门就叫\"聚宝门\"。当然啦，这只是传说，真实的原因是古人特别会打地基。\n乐乐，你仔细看墙上的砖头，每一块上面都刻着字：谁烧的砖、哪个官员验收的，全写得清清楚楚。要是砖头质量不好，他们都要被处罚，这叫\"责任制\"。所以六百年过去了，这些砖还结结实实的。\n小任务：找一块刻字最清楚的砖，把上面的字念给爸爸妈妈听，看看你是不是\"寻宝小侦探\"。","nanjing-laomendong":"乐乐，欢迎来到老门东！它的名字很有意思：中华门的东边就叫\"门东\"，我们脚下这条几百年的老街，就藏在明城墙的脚下。\n你看脚下的青石板路，被几百年的脚步磨得光溜溜的；两边的房子是白墙灰瓦马头墙，屋顶两边翘翘的，像给房子戴了顶小帽子。古代的马头墙还有一个实用本领——防火！一家着火，高高的墙能挡住火苗，不让它窜到隔壁去。\n老门东是手艺人和小吃的天堂。街上有吹糖人的爷爷，一团糖在他手里吹几下、拉几下，就变成一只小兔子或者一条龙；还有画秦淮灯彩的铺子，荷花灯、兔子灯排成一排，晚上点亮可漂亮了。小吃更是数不清：梅花糕、糖芋苗、小笼包……闻一闻都流口水。\n小巷子里还藏着好多老名字：剪子巷、箍桶巷、三条营——一听就知道以前这条巷子里的人是做剪子的、做木桶的。古代人给巷子起名字特别实在，卖什么就叫什么。\n乐乐，给你一个小任务：这条街上藏着至少三种不一样形状的屋檐，有翘的、有平的、有带花纹的，看谁先找齐。找到以后，再挑一盏最喜欢的灯笼，给它起一个好听的名字——说不定明年灯会就挂出来你起名字的灯啦。","luoyang-longmen":"乐乐，现在站在你面前的，是全世界最有名的石头艺术宝库之一——龙门石窟！一千五百多年前，古人在伊河两岸的大山上，硬是刻出了两千三百多个洞窟、十万多尊佛像。\n先考你：为什么叫\"龙门\"？这条河两岸的山原来叫\"伊阙\"，像一扇大门。后来隋朝的皇帝杨广说，这不是皇帝走过的\"龙门\"嘛，名字就流传下来了。\n跟我走，马上你要见到这里最尊贵的大佛——卢舍那大佛，十七米多高，光耳朵就有一米九，比爸爸还高！传说它的模样是照着武则天四十多岁时的样子刻的。武则天为了修它，捐出了自己两年的化妆钱，一共两万贯。所以大家叫它\"武则天的微笑\"——不管你站在哪儿，它都温柔地看着你。乐乐，一个女孩子能成为管着整个王朝的皇帝，是不是很了不起？\n山上还有很多趣味小秘密：万佛洞里密密麻麻刻了一万五千尊小佛像，最小的只有两厘米，跟你的指甲盖差不多；宾阳北洞还有一尊 famous 的\"剪刀手佛\"，它的手摆得像在比\"耶\"——其实那是手指断了以后的样子，但游客都爱跟它合影。\n最后说说这些佛像怎么来的：没有起重机、没有电钻，工匠们靠锤子和凿子，一锤一锤刻了四百多年。乐乐，小任务是找一找那尊\"剪刀手佛\"，和它合个影，再把万佛洞的小佛像数到二十尊。","luoyang-museum":"乐乐，接下来这个地方，藏着洛阳\"十三朝古都\"的家底——洛阳博物馆。里面的宝贝多得数不清，我给你三个寻宝线索，看你能不能全部找到。\n第一件宝贝是\"华夏第一爵\"。它是一只三千多岁的青铜小酒杯，三条腿细细的，像三根小火柴撑着一个碗。别看它小，它可是夏朝的文物，是中国已经发现的最老的酒杯之一！\n第二件是东汉石辟邪——一只长着翅膀的大石狮子，重达八吨多，比两头大象加起来还重。传说它能赶走坏东西，是守陵神兽。你站在它旁边拍张照，就像被小卫士保护着。\n第三件是曹魏白玉杯。它通体雪白，没有任何花纹，一千八百年了还像新的一样。越是简单的越珍贵，它用的玉料好到工匠都舍不得多刻一刀。\n对了，别忘了找找唐三彩！洛阳是唐三彩的故乡，那种黄绿白三种颜色 flowing 在一起的陶瓷马，是唐朝最流行的宝贝。有一个小秘密：唐三彩其实是陪葬品，唐朝人家里可不摆它。\n博物馆还有个规矩：每件文物都有\"身份证\"，写着它几岁、从哪儿出土的。乐乐，小任务是挑一件你最喜欢的文物，记住它的名字和年龄，晚上讲给爷爷奶奶听——你就是我们家的\"小小讲解员\"。","luoyang-baimasi":"乐乐，眼前这座寺可不简单——白马寺，中国佛教的\"第一座\"寺院，今年已经快两千岁了！\n它的故事要从一场梦说起。东汉的皇帝刘庄，有一天晚上梦见一个金光闪闪的神人，绕着大殿飞。第二天他问大臣，大臣说：西方有位神仙叫\"佛\"，长得跟您梦里的很像！于是皇帝派使者去西边寻找，三年后，使者请来了两位印度高僧，还用一匹白马驮着经书和佛像回到洛阳。皇帝高兴极了，下令修一座寺院，就让白马站在最前面，取名\"白马寺\"。是不是有点像真实版的\"白龙马\"故事？\n寺里的齐云塔还有一个声学魔法：你站在塔旁边用力拍手，塔里会传回\"嘎哇、嘎哇\"的声音，像青蛙在叫！古人给它起了个外号叫\"蛤蟆塔\"。这其实是回声被塔身反射造成的，跟北京天坛的回音壁是一个原理。\n白马寺里还有一片\"国际佛殿区\"：泰国来的金色佛殿、缅甸来的白色佛塔、印度来的穹顶大殿，走一圈就像出了一趟国。\n乐乐，小任务来啦：第一，去齐云塔拍拍手，听听\"青蛙\"的回声；第二，在国际佛殿区找一找你最喜欢的建筑，说说它跟中国寺庙有什么不一样。","luoyang-luoyi":"乐乐，今晚我们穿越啦——洛邑古城，被称为\"中原渡口\"，是洛阳最像古代的地方。\n先说文峰塔，这座宋代宝塔立在这里快一千年了。古时候读书人考试前，都要来拜拜它，祈求\"文运亨通\"。塔身上还挂着小铃铛，风一吹叮叮当当，好像在给认真读书的乐乐加油。\n洛邑古城现在是全国有名的\"汉服天堂\"。你会看到满大街的姐姐们穿着唐朝的齐胸襦裙、宋朝的褙子，梳着古人的发髻，走在青砖灰瓦之间，一秒钟穿越回千年前的洛阳城。乐乐，你要不要也挑一套小汉服？穿上它，你就是从古画里走出来的小仙女，我们全家在文峰塔下拍一张\"穿越全家福\"。\n城里还有好多非物质文化遗产：吹糖人的爷爷能把糖稀吹成小兔子；皮影戏的幕布后面，艺人的手一抖，小人儿就打起架来；还有画糖画的，一勺糖稀绕几圈，一条金龙就趴在石板上了。\n对了，晚上这里的灯光亮起来，塔影倒映在水里，特别梦幻。\n乐乐，小任务：第一，选一样非遗手艺，看看师傅是怎么做的；第二，全家汉服合影的时候，你来当\"导演\"，指挥大家摆造型！","luoyang-yingtianmen":"乐乐，抬头看这座巨大的城门——应天门！它有一百四十多米宽，是隋唐时期洛阳城皇宫的正南门，号称\"隋唐第一门\"。\n我要告诉你一个特别特别重要的秘密：一千三百多年前，就在这座城门上，站过中国历史上唯一的女皇帝——武则天！公元690年，她在这里宣布改国号为周，正式登基。要知道，那个时代全世界的女性几乎都不能做官、不能主事，而武则天凭着自己的智慧和胆量，管起了整个国家，还把国家治理得井井有条。乐乐，女孩子的力量从来都不小，你以后想做什么，都可以大胆去做。\n应天门的造型也超级气派：两边各伸出一对\"阙楼\"，像大鸟张开的两只翅膀，这种造型叫\"双向三出阙\"，是皇帝专用的最高等级。当年外国使臣来朝拜，就是从这座门进皇宫的，门前广场上站满了各国客人，特别壮观。\n现在每晚这里都有灯光秀和投影表演，激光把整座城门变成一块巨大的画布：宫殿飞起、凤凰盘旋、武则天的仪仗队从城门里走出来……像一场光影魔法。\n乐乐，小任务：灯光秀开始时，找一找画面里的凤凰在哪里，再看一看城门上有没有出现\"应天门\"三个大字。","xian-bingmayong":"乐乐，欢迎来见\"世界第八大奇迹\"——秦始皇兵马俑！\n先讲一个传奇故事：1974年，临潼的农民伯伯杨志发打井找水，挖着挖着，挖出了一个\"陶瓦人\"的头！就这样，睡了两千多年的地下军团被发现了。现在那位伯伯还在景区给游客签名呢。\n一号坑里有八千多个兵马俑，最神奇的是——没有两张一样的脸！工匠是照着真士兵的样子捏的：有的方脸、有的圆脸，有的胡子上翘、有的嘴角带笑，连头发丝都刻得清清楚楚。仔细看，他们原来的衣服是彩色的：红的、绿的、紫的，可漂亮了。可惜埋了两千多年，一出土接触空气，颜色几分钟就掉光了，现在只能看到灰扑扑的陶土色。\n俑坑里还有一个未解之谜：一尊跪射俑的脸是绿色的！别的俑都是粉色脸，就他是绿的，考古学家研究了半天也没搞明白，有人说是恶作剧，有人说是 camouflage 迷彩。乐乐，你觉得呢？\n旁边还有两辆青铜马车，用金银装饰得金光闪闪，是给秦始皇坐的\"古代劳斯莱斯\"。\n小任务：在一号坑里找一找，哪个兵马俑长得最像你认识的人？还有，找找看谁站在队伍最前排——猜猜他们是什么兵种？","xian-dayanta":"乐乐，看过西游记吧？孙悟空保护唐僧去西天取经。告诉你一个秘密：唐僧是真有其人，他就叫玄奘，而且取经路上没有孙悟空保护，全靠他自己！这座大雁塔就是他亲自主持修建的。\n一千三百多年前，玄奘一个人从长安出发，走了五万里路，用了十七年，从印度带回来六百多部佛经。路上他翻过雪山、穿过沙漠，好几次迷路，水囊都空了，硬是靠着毅力走了下来。回到长安后，皇帝请他当大官他不要，一心只想把带回来的经书翻译好、保存好，于是修了这座塔，因为藏经的传说，取名\"大雁塔\"，高六十四米，一千三百年了还稳稳地站着。\n塔的旁边有个特别有名的传统叫\"雁塔题名\"：唐朝的读书人考中进士后，要到塔下写上自己的名字。大诗人白居易考中时得意地写诗：\"慈恩塔下题名处，十七人中最少年。\"意思是十几个人里我最年轻！\n对了，大雁塔以前还歪过一米多，后来人们给地下回灌地下水，它又慢慢\"站直\"了，是不是很神奇？\n乐乐，小任务：第一，站在塔下猜猜它有几层；第二，记住玄奘的两个数字——五万里路和十七年，晚上讲给爷爷奶奶听。","xian-datangbuyecheng":"乐乐，天黑以后，我们要走进一条会发光的街——大唐不夜城！它有两千一百米长，一到晚上，灯光全亮，金色的屋顶、红色的灯笼，走在里面就像真的回到了一千多年前最热闹的唐朝。\n这条街上藏着好几位\"网红\"。第一位是不倒翁小姐姐：她站在一个不倒翁道具上，穿着飘逸的唐代裙子，轻轻一晃，伸出手拉游客的手转圈，当年她的视频火遍了全中国，好多人排两个小时的队，就为了被她牵一下手。\n第二位是\"盛唐密盒\"里的两位大人——房玄龄和杜如晦，他们可是唐朝真正的名臣，\"房谋杜断\"说的就是他俩。现在演员扮演他们出题考游客，答对了还有奖品，答错了会被\"罚\"表演节目，特别好玩。\n还有\"李白\"在街上找人 对诗！他说上一句\"床前明月光\"，你要是能接出下一句，就有小礼物。乐乐背过的古诗那么多，这时候可就派上用场啦。\n街上还有会跳舞的石头哥、悬浮的\"兵马俑\"，到处都是惊喜。\n乐乐，小任务：今晚至少完成一项挑战——跟\"李白\"对一句诗，或者数一数街上你看到的唐朝造型的小姐姐有几位。对了，逛累了别忘了我在这儿等你，随时可以\"回宫\"休息。","xian-shanxi-history":"乐乐，今天我们只给你一天时间，却要看\"一百多万年的宝贝\"——陕西历史博物馆！这里的文物多到有一百七十一万多件，光是把它们数一遍就要花好几年。\n第一件必看的宝贝是兽首玛瑙杯：它用一整块红色玛瑙雕成，杯子的前端做成牛头的样子，是全世界独一无二的一件，国家规定它永远不许出国展览——出了国门就再也回不来了。\n第二件是皇后之玺，一方用和田羊脂玉做的玉玺，主人是汉朝的吕后，是皇后才能用的印章。它还有个传奇故事：1968年，一个13岁的小学生放学路上，在水渠边捡到了这块白石头，交给了国家——结果竟然是国宝！乐乐，你看，小学生也能发现国宝哦。\n第三件是鎏金舞马衔杯银壶。唐朝的皇帝过生日时，会训练马匹跳舞祝寿——马儿们随着音乐抬起前腿、嘴里叼着酒杯，把杯子送到皇帝面前。这把银壶就是那场面的定格。\n对了，博物馆里还有一整个展厅来自\"何家村宝藏\"：1970年工人挖地基，一锹下去挖出两大瓮金银珠宝，一共一千多件，全是唐朝顶级奢侈品。\n乐乐，小任务：找到那方玉玺，替那位小学生哥哥感到骄傲；再挑一件你最想带回家的宝贝，说说理由。","xian-citywall":"乐乐，今天我们要在六百岁的城墙上散步甚至骑车——西安城墙，中国现存最完整的古代城垣，一圈整整13.74公里！\n明朝人修墙的时候有个独家秘方：砌砖的泥浆里掺了糯米汁，就是把糯米熬成黏黏的浆糊拌进去，干了以后硬得像水泥，所以人们笑称这是\"糯米城墙\"。你凑近砖缝闻一闻——好吧，闻不到糯米的香味了，它已经是六百岁的\"老砖\"了。\n城墙上一共有九十八座突出去的墩台，叫\"敌台\"，士兵可以站在上面从三个方向射箭保卫城墙。墙顶特别宽，最宽的地方能并排开好几辆车，所以现在成了全世界最酷的\"空中跑道\"——很多人租自行车绕城墙骑一大圈，骑完正好两小时。\n我们所在的永宁门是正南门，也是最有仪式感的门：晚上有\"梦长安\"迎宾演出，穿古装的\"士兵\"和\"宫女\"列队开门，仿佛古时候迎接贵宾的仪式。\n站在墙上往两边看，墙里是钟楼、鼓楼和密密麻麻的老房子，墙外是高楼大厦——一墙之隔，六百年。\n乐乐，小任务：第一，找一块刻着字的城砖，那是烧砖工匠留下的\"签名\"；第二，数一数你能看到几座敌台，数清楚了告诉我。","xian-huiminjie":"乐乐，中午我们要当一回\"老西安\"——去回民街吃到扶墙出！\n先说说这片街区：北院门、大皮院、洒金桥，名字都特别有故事。比如\"大皮院\"，是因为明朝时这条巷子里住的都是做皮货的手艺人；\"洒金桥\"的传说更浪漫，说是有位皇帝站在桥上往下洒金子奖励百姓。\n来这儿一定要吃羊肉泡馍，而且有个讲究：馍要自己掰！把圆圆的烙饼掰成黄豆大小的小块，掰得越匀，煮出来越入味。据说掰得漂亮的，师傅一眼就知道是懂行的。掰馍的过程就像玩拼图，全家人一起掰，比谁掰得最标准。\n甜口的有甑糕——用枣泥和糯米在一种叫\"甑\"的古老炊具里蒸出来，软软糯糯，枣香扑鼻，这个点心已经传承上千年了；还有小小圆圆的镜糕，上面蘸满果酱和花生碎，像一面小镜子。\n这里还藏着一条化觉巷，巷子里有座一千三百多年的大清真寺，是中国四大清真寺之一，青砖古殿藏在热闹的街道后面，特别安静。\n乐乐，小任务：第一，亲自掰馍，目标是掰出一小碗\"黄豆粒\"；第二，挑一样你没见过的小吃，尝一口，然后用一个词形容它的味道，晚上考你哦。","sanmenxia-huashan":"乐乐，今天我们要去挑战\"奇险天下第一山\"——华山！先别紧张，我们不用爬山，坐索道上去。\n先讲一个特别棒的故事。传说有个叫沉香的小男孩，他的妈妈因为触犯天条，被压在华山底下。沉香长大后，拜师学艺，练就一身本领，然后扛起一把神斧，冲上西峰，大喝一声，一斧头劈开山石，救出了妈妈！西峰山顶上真的有一块\"斧劈石\"，中间一条大裂缝，据说就是沉香劈山留下来的。乐乐，沉香为了救妈妈，什么都不怕——这就是爱带来的勇气。\n坐西峰索道上山也超级刺激：这条索道又长又陡，缆车爬过山谷的时候，往窗外看，花岗岩的大石壁就在脚边，像坐上了\"开往云端的小火车\"。到站以后，山顶居然是一大片平地，走几步就能看到西峰——它又叫莲花峰，因为峰顶像一朵石头莲花。\n站在山顶往远处看，白云就在脚下飘，群山变成了小土包。金庸爷爷的小说里，武林高手们还在华山之巅\"华山论剑\"呢，山顶真的立着一块\"华山论剑\"的石碑。\n乐乐，小任务：第一，找到斧劈石，听爸爸讲一遍沉香的故事；第二，在山顶张开手臂拍一张照片，假装自己要飞起来。","sanmenxia-hangu":"乐乐，今天我们去一个\"出成语\"的地方——函谷关。这里出了好几个你以后语文课上肯定要学的成语，我先给你剧透两个。\n第一个叫\"紫气东来\"。两千五百多年前，守关的官员尹喜早上登楼望气，发现东边有一大团紫色的祥气飘过来——他知道有大人物要来了！果然，是大学问家老子骑着青牛缓缓走来。尹喜赶紧把他留下来，请他写点东西传世。老子大笔一挥，写下五千个字，就是大名鼎鼎的《道德经》，然后出关而去，谁也不知道他去了哪里。一部只有五千字的书，成了影响中国两千多年的经典，你说厉害不厉害？\n第二个成语叫\"鸡鸣狗盗\"。战国时候，孟尝君被秦国扣住，他有个门客半夜学鸡叫，骗开了城门，帮孟尝君逃了出去。原来连\"学鸡叫\"这样的小本事，用在对的地方也能救命。\n这里的关楼特别雄伟，古人说\"一夫当关，万夫莫开\"——一个人把住关口，一万个人也攻不进来，因为两边的山路太险了。\n乐乐，小任务：《道德经》里有一句话最适合我们——\"千里之行，始于足下\"，意思是再远的路也要从脚下第一步走起。今天你已经在函谷关迈出了这一步，跟我大声念一遍好不好？","sanmenxia-dikengyuan":"乐乐，今天带你去看一个会\"隐身\"的村庄——陕州地坑院！当地人有个顺口溜：\"见树不见村，进村不见房，闻声不见人。\"远远看去是一片平地，村子去哪儿了？答案在地下！\n这里的房子是往地下挖出来的大院子，四四方方，深六七米，像把\"四合院\"整个搬进了地底下，所以叫\"地下四合院\"。这种住法已经传承四千多年了，是全世界独一无二的民居。地坑院里冬暖夏凉，夏天不用空调，冬天不用暖气，温度刚刚好，住着可舒服了。\n你肯定想问：下大雨怎么办？水往哪儿流？古人可聪明了：院子里挖了渗水坑，雨水慢慢渗进土里；还打了一眼水井，吃水不出门。院子中间种一棵大树，树冠露在地面上，路过的人一看树就猜到下面住着人。\n这里还有两大宝藏：一个是\"穿山灶\"——一溜九个灶眼排成弧形，火从第一个灶进去，热度依次传到后面，九口锅同时炖九样菜，炖出的\"十大碗\"香飘满院；另一个是陕州剪纸，一把剪刀一张纸，剪出满窗的花。\n乐乐，小任务：第一，数一数穿山灶有几个锅；第二，找一幅你最喜欢的剪纸，说说上面剪的是什么故事。","sanmenxia-swan":"乐乐，明天和天鹅有约？先给你讲讲它们的秘密。\n我们脚下这片天鹅湖湿地公园，是黄河边的宝贝湿地。每年10月底，会有几千只白天鹅从遥远的西伯利亚飞来，在这里一直住到第二年三月才回老家——所以三门峡有个可爱的外号，叫\"天鹅城\"。它们要飞三四千公里，飞过高山、越过草原，好不容易才到这里过冬，全家人都得轻声细语，别打扰它们休息。\n你可能会问：现在才10月初，天鹅到了吗？大部队还要等上两三个星期呢。不过别失望——湿地里的芦苇荡现在正是最好看的时候，一大片金色随风摇摆；白鹭、野鸭和一些\"先头部队\"的绿头鸭已经在水里上班了。我们沿着黄河栈道走一走，说不定就能遇到几只提前到的\"侦察兵\"。\n天鹅还是\"忠诚\"的代名词：它们一生基本上只有一个伴侣，天鹅爸爸天鹅妈妈会一起带大所有的小天鹅，飞行时队形也排得整整齐齐。\n乐乐，小任务：第一，在栈道上找一找水鸟，看谁能说出它的名字；第二，我们拉钩约定——等天鹅大部队来了，冬天专门再回来一次，看好不好？","sanmenxia-guoguo":"乐乐，这个博物馆里的故事，比动画片还精彩——虢国博物馆，它是在一座两千多年前的国君墓地上面直接建起来的！\n先讲讲\"虢国\"。周朝的时候，周文王把两个弟弟分封在这里做诸侯王，建立了一个叫\"虢\"的小国。这个小国的将军们特别会打仗，博物馆里就陈列着他们的\"豪车\"——出土的马车轮子、车厢骨架排成军阵，比秦始皇兵马俑还要早七百多年呢！\n这里还诞生了两个你语文课上一定会学的成语：\"唇亡齿寒\"和\"假道伐虢\"。晋献公想灭掉虢国，但要借虞国的路；虞国大臣劝国君：嘴唇没了，牙齿就会觉得冷，虢国亡了，我们也保不住！贪心的国君不听，结果虢国灭亡后，虞国在回国的路上也被顺手灭掉了。两个国家因为不团结，一起完蛋了。\n镇馆之宝是\"中华第一剑\"——一把玉柄铜芯铁剑，距今近三千年，它的出现把中国的冶铁历史往前推了两大步！剑柄是玉做的，剑身是铁的，只有国君才配拥有。\n乐乐，小任务：第一，看车马坑的时候，数一数你能看到几个车轮；第二，把\"唇亡齿寒\"的意思讲给爸爸妈妈听，讲对了你就是今天的小博士。","sanmenxia-daba":"乐乐，今天我们去看\"万里黄河第一坝\"——三门峡大坝！\n先讲一个古老的传说。很久很久以前，黄河发大水淹了好多地方，大禹带人来治水，举起大斧头把挡路的山劈成了三座岛：人门、神门、鬼门——\"三门峡\"的名字就是从这儿来的。大水顺着三道门乖乖流走，从此不再乱淹田地。\n大坝是1957年开始修建的，是黄河上的第一座大坝，成千上万的工程师和工人用了好几年才建成。坝头上立着一块神奇的石头叫\"砥柱石\"，无论黄河发多大的水，它都稳稳地立在激流中间，一动不动——这就是成语\"中流砥柱\"的由来，用来形容在困难面前不低头的人。唐太宗李世民还专门为它写过诗呢。\n如果你看到大坝开闸放水，一定要看仔细：几股巨大的水柱从闸口喷涌而出，轰隆隆的声音像打雷，水雾扑面而来，夏天站在边上特别凉快。那是工程师们定期\"调水调沙\"，用水的力量给黄河\"洗澡\"，把淤泥冲走。\n乐乐，小任务：第一，在坝上找一找砥柱石，它就站在河中央；第二，大声说出\"中流砥柱\"这个成语，回家考考爷爷奶奶它是什么意思。","kaifeng-qingminghuayuan":"乐乐，今天我们要搬进一幅画里——清明上河园！它是照着一幅国宝级的画1:1建出来的：北宋画家张择端的《清明上河图》，这幅画有五米多长，里面画了八百多个人物、二十多条船，记录了九百多年前开封作为大城市的热闹生活。整幅画看完，就像坐着时光机在宋朝的大街上逛了一圈。\n走进园子，你就是宋朝人啦：街上的\"行人\"都穿着宋代衣服，店铺招牌全是仿古的。每天上午有\"包公迎宾\"——包青天带着卫队出城迎客；还有\"王员外招婿\"，王员外的女儿要抛绣球选夫婿，楼下的游客都可以伸手去抢，抢到的还能上台\"拜堂\"呢！最刺激的是\"岳飞枪挑小梁王\"的马战表演，马蹄翻飞、尘土飞扬，看得人心跳加速。\n园子中间的汴河上有一座彩虹一样的桥，叫虹桥，就是画里最有名的那座。桥下的\"大船\"过桥、桥上的人围观，九百年前画里的场景，现在就演给你看。\n晚上的《大宋·东京梦华》演出更震撼：几百人在水上表演，灯光、火焰、音乐，把大宋的辉煌演给你看。\n乐乐，小任务：第一，在园里找一幅《清明上河图》的拼图或画卷，数数画里能不能找到八百个人物；第二，看看今天有哪些宋代\"职业\"，挑一个你最想做的。","kaifeng-longting":"乐乐，今天最后一个景点特别气派——龙亭！你以为它是一座亭子？错啦，它是一座建在高台上的大殿，脚下踩着的是六朝皇宫的遗址：后梁、后晋、后汉、后周、北宋、金朝，六个朝代的皇宫都曾建在这里。可以说，你脚下的每一块土，都埋着皇帝的故事。\n登上龙亭大殿要爬七十二级台阶。别怕累，爬到顶上你就赚大了：整个开封城尽收眼底，往两边看是两个大湖——东边是潘家湖，西边是杨家湖。这里有个流传很久的传说：潘湖是奸臣潘仁美家的，湖水浑浊；杨湖是忠臣杨家将家的，湖水清澈——老百姓用一个湖来说\"忠奸分明\"。其实呀，真实原因是两个湖的深浅和水草不一样，但这个传说让湖水都变得有故事了。\n龙亭一带还有个传统：每年10月前后办菊花展，几万盆菊花摆成各种造型——金龙、宝塔、孔雀，五颜六色，因为开封从宋朝就开始种菊花，是有名的\"菊城\"。秋天来开封，不看菊花等于白来。\n乐乐，小任务：第一，一边爬台阶一边数，看是不是七十二级；第二，站上大殿前挑一朵你觉得最漂亮的菊花，给它拍一张\"证件照\"。"};

function embedVideo(id,platform,encodedName){
  const name=decodeURIComponent(encodedName);
  const c=$("#vid-"+id);
  if(!c)return;
  if(c.style.display==="block"&&c.dataset.platform===platform){c.style.display="none";return}
  let src="";
  if(platform==="bili"){
    const bvid=BILI_VIDS[id];
    if(bvid){src=`https://player.bilibili.com/player.html?bvid=${bvid}&autoplay=false&high_quality=1`}
    else{window.open("https://search.bilibili.com/all?keyword="+encodedName+"%20旅游攻略","_blank");return}
  }
  c.innerHTML=`<iframe src="${src}" style="width:100%;height:210px;border:none;border-radius:12px" allowfullscreen sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>`;
  c.style.display="block";c.dataset.platform=platform;
}
function toggleSpot(id){const el=$("#spot-"+id);el.classList.toggle("open");
  const spot=SPOTS.find(s=>s.id===id);
  if(el.classList.contains("open")&&!audios[id]&&spot?.voice!=="browser"){const a=new Audio("audio/"+id+".mp3");a.preload="none";
    a.addEventListener("timeupdate",()=>{const f=$("#pf-"+id);if(f)f.style.width=(a.currentTime/a.duration*100||0)+"%";const t=$("#pt-"+id);if(t)t.textContent=fmt(a.currentTime);const dd=$("#pd-"+id);if(dd&&a.duration)dd.textContent=fmt(a.duration)});
    a.addEventListener("ended",()=>{setPlayIcon(id,false)});
    audios[id]=a;}}
function setPlayIcon(id,playing,loading){const b=$("#pl-"+id+" .play-btn");if(!b)return;
  b.classList.toggle("loading",!!loading);
  b.innerHTML=loading?`<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7z"/></svg>`:playing?`<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>`:`<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`}
const SPEAKING={id:null};
function stopSpeak(){if(SPEAKING.id){if(window.speechSynthesis)speechSynthesis.cancel();setPlayIcon(SPEAKING.id,false);SPEAKING.id=null}}
function speakNarr(id){const u=new SpeechSynthesisUtterance(NAR[id]||"");u.lang="zh-CN";u.rate=1;SPEAKING.id=id;setPlayIcon(id,true);
  u.onend=u.onerror=()=>{if(SPEAKING.id===id){SPEAKING.id=null;setPlayIcon(id,false)}};
  speechSynthesis.speak(u);toast("这段录音还在路上，先用浏览器读给乐乐听 🎧")}
function playAudio(id){
  const spot=SPOTS.find(s=>s.id===id);
  if(spot?.voice==="browser"){
    if(SPEAKING.id===id)stopSpeak();
    else{Object.entries(audios).forEach(([k,x])=>{if(!x.paused){x.pause();setPlayIcon(k,false)}});stopSpeak();speakNarr(id);}
    return;
  }
  const a=audios[id]||(()=>{toggleSpot(id);return audios[id]})();
  if(a.paused&&SPEAKING.id!==id){Object.entries(audios).forEach(([k,x])=>{if(k!==id&&!x.paused){x.pause();setPlayIcon(k,false)}});stopSpeak();
    if(a.readyState===0)setPlayIcon(id,false,true);
    a.addEventListener("canplay",()=>setPlayIcon(id,true),{once:true});
    a.play().catch(()=>{if(NAR[id]&&window.speechSynthesis)speakNarr(id);else toast("音频加载失败，请稍后再试")});setPlayIcon(id,true);
  }else{a.pause();stopSpeak();setPlayIcon(id,false)}}
function seekBar(e,id){const a=audios[id];if(!a||!a.duration)return;const r=e.currentTarget.getBoundingClientRect();a.currentTime=(e.clientX-r.left)/r.width*a.duration}
function cycleSpeed(id){const s=[1,1.25,1.5,0.75];speeds[id]=((speeds[id]??0)+1)%s.length;const v=s[speeds[id]];if(audios[id])audios[id].playbackRate=v;$("#ps-"+id).textContent=v.toFixed(2).replace(/0+$/,"").replace(/\.$/,"")+".x"}
function toggleScript(id){const s=$("#sc-"+id);s.style.display=s.style.display==="none"?"block":"none"}
function fmt(t){if(!isFinite(t))return"00:00";const m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}

const LS="trip_hotels_v4";
const API = "https://astock.taoge.xyz/api";
let TODOS = [];
const ST_MAP = {todo:["todo","未预订"],booked:["booked","已预订 ✔"],paid:["paid","已付款 💰"],cancel:["cancel","已取消"]};

async function loadTodos() {
  try {
    const r = await fetch(API + "/todos");
    const j = await r.json();
    if (j.ok) TODOS = j.todos;
  } catch(e) { TODOS = []; }
  renderTodo();
}
async function saveTodos() { renderTodo(); }
async function updateTodo(id, data) {
  try {
    const r = await fetch(API + "/todos/" + id, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(data) });
    const j = await r.json();
    if (j.ok) { const idx = TODOS.findIndex(t => t.id === id); if (idx >= 0) TODOS[idx] = j.todo; }
  } catch(e) {}
  renderTodo();
}
async function renderTodo() {
  const done = TODOS.filter(t => t.st === "booked" || t.st === "paid").length;
  $("#todoDot").style.display = (done < TODOS.length) ? "" : "none";
  $("#p-todo").innerHTML = `
  <div class="sec-title" style="margin-top:8px"><span class="bar"></span>📋 预订待办清单 <span class="tiny" style="font-weight:400">全家共享进度·谁完成谁负责</span></div>
  <div class="card prog"><b class="serif">${done}/${TODOS.length}</b><div class="bar"><i style="width:${TODOS.length ? done / TODOS.length * 100 : 0}%"></i></div><span class="tiny">已完成</span></div>
  <div class="notice">💡 点圆圈切换状态（未预订→已预订→已付款→已取消），状态会同步给全家人。谁预订了谁填写名字，避免重复操作。</div>
  ${TODOS.map(t => {
    const [cls, label] = ST_MAP[t.st] || ST_MAP.todo;
    const isDone = t.st === "booked" || t.st === "paid";
    const who = t.who ? "<span style='color:var(--teal);font-size:12px'>👤 " + esc(t.who) + "</span>" : "";
    return `<div class="card todo-item ${isDone ? "done" : ""}">
    <div class="cb" onclick="cycleSt(${t.id})"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
    <div class="todo-ct">
      <div class="nm">${esc(t.nm)}<span class="st ${cls}">${label}</span>${who}</div>
      <div class="sub"><i>📅 ${esc(t.sub)}</i>${t.price && t.price !== "—" ? `<i>💰 ${esc(t.price)}</i>` : ""}</div>
      ${t.note ? `<div class="tiny" style="margin-top:4px;color:#8a6414">💡 ${esc(t.note)}</div>` : ""}
      <div class="todo-ops"><button onclick="editTodo(${t.id})">✏️ 编辑</button><button onclick="delTodo(${t.id})">🗑 删除</button></div>
    </div></div>`;
  }).join("")}
  <button class="btn-add" onclick="editTodo(-1)">＋ 添加新待办</button>`;
}
async function cycleSt(id) {
  const t = TODOS.find(x => x.id === id); if (!t) return;
  const o = ["todo", "booked", "paid", "cancel"];
  const newSt = o[(o.indexOf(t.st) + 1) % o.length];
  const who = newSt === "booked" || newSt === "paid" ? (prompt("请填写你的名字（方便家人知道谁已预订）：", t.who || "") || t.who) : "";
  await updateTodo(id, { st: newSt, who });
}
async function delTodo(id) {
  const t = TODOS.find(x => x.id === id);
  if (!t || !confirm("确定删除「" + t.nm + "」？")) return;
  try {
    await fetch(API + "/todos/" + id, { method: "DELETE" });
    TODOS = TODOS.filter(x => x.id !== id);
    renderTodo();
    toast("已删除");
  } catch(e) {}
}
function editTodo(id) {
  const t = id >= 0 ? TODOS.find(x => x.id === id) : { nm: "", sub: "", price: "", note: "", st: "todo", who: "" };
  if (!t) return;
  $("#modal").innerHTML = `<h3>${id >= 0 ? "编辑待办" : "新增待办"}<button onclick="closeModal()">×</button></h3>
  <div class="fld"><label>名称（酒店/事项）</label><input id="f-nm" value="${esc(t.nm)}" placeholder="如：汉庭酒店(洛阳龙门石窟店)"></div>
  <div class="fld-2">
    <div class="fld"><label>日期 / 说明</label><input id="f-sub" value="${esc(t.sub)}" placeholder="如：9/26-9/27 连住2晚"></div>
    <div class="fld"><label>价格</label><input id="f-price" value="${esc(t.price)}" placeholder="如：200-350/晚"></div>
  </div>
  <div class="fld"><label>备注</label><textarea id="f-note" rows="2" placeholder="选填">${esc(t.note)}</textarea></div>
  <div class="fld-2">
    <div class="fld"><label>状态</label><select id="f-st">${Object.entries(ST_MAP).map(([k, v]) => `<option value="${k}" ${t.st === k ? "selected" : ""}>${v[1]}</option>`).join("")}</select></div>
    <div class="fld"><label>负责人</label><input id="f-who" value="${esc(t.who || "")}" placeholder="谁经手"></div>
  </div>
  <button class="btn primary" onclick="saveTodo(${id})">保存</button>`;
  $("#mask").classList.add("show");
}
async function saveTodo(id) {
  const data = { nm: $("#f-nm").value.trim(), sub: $("#f-sub").value.trim(), price: $("#f-price").value.trim(), note: $("#f-note").value.trim(), st: $("#f-st").value, who: $("#f-who").value.trim() };
  if (!data.nm) { toast("名称不能为空"); return; }
  try {
    if (id >= 0) {
      await updateTodo(id, data);
    } else {
      const r = await fetch(API + "/todos", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(data) });
      const j = await r.json();
      if (j.ok) TODOS.push(j.todo);
    }
    renderTodo();
    closeModal();
    toast("已保存 ✓");
  } catch(e) { toast("保存失败"); }
}

async function checkCached(){
  if(!("caches" in window))return;
  const c=await caches.open("trip-audio-v2");
  const keys=await c.keys();
  const audio=keys.filter(k=>k.url.includes("/audio/")).length;
  const need=SPOTS.filter(s=>s.voice!=="browser").length;
  if(audio>=need){const s=$("#dlStatus");if(s){s.className="sw-hint ok";s.innerHTML=`<span>✅</span><span>语音离线包已就绪（${need}/${need}），没网也能听。</span>`}}
  return audio;
}
async function cacheAllAudio(btn){
  btn.disabled=true;btn.textContent="正在下载…";
  const c=await caches.open("trip-audio-v2");
  const ids=SPOTS.filter(s=>s.voice!=="browser").map(s=>s.id);
  let ok=0;
  for(let i=0;i<ids.length;i++){
    try{const r=await fetch(`audio/${ids[i]}.mp3`);if(r.ok){await c.put(`audio/${ids[i]}.mp3`,r);ok++}}catch(e){}
    const f=$("#dlFill");if(f)f.style.width=((i+1)/ids.length*100)+"%";
    const st=$("#dlStatus");if(st&&!st.classList.contains("ok"))st.innerHTML=`<span>⬇️</span><span>下载中 ${i+1}/${ids.length}…</span>`;
  }
  if(ok===ids.length){const s=$("#dlStatus");s.className="sw-hint ok";s.innerHTML=`<span>✅</span><span>语音离线包已就绪（${ok}/${ids.length}），没网也能听。</span>`;btn.textContent="✅ 已就绪，全程离线可用";toast("离线包完成 🎉")}
  else{btn.disabled=false;btn.textContent="重试下载";toast(`完成 ${ok}/${ids.length}，可重试`)}
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").then(()=>maybeShowFab()).catch(()=>maybeShowFab());

</script>

<!-- 乐乐小导游专属：iPad 实时自动刷新与 MiMo 语音播报组件 -->
<div id="lele-update-toast" style="display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#e8b95a,#d49430);color:#221500;padding:14px 28px;border-radius:99px;font-size:16px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.35);z-index:99999;border:2px solid #fff3d0;">
  🎉 乐乐小导游新任务发布！正在播放小米 MiMo 语音讲解...
</div>
<script>
(function() {
  let localVer = null;
  const audioObj = new Audio();
  function checkLeleUpdates() {
    fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        if (!data || !data.version) return;
        if (localVer === null) {
          localVer = data.version;
        } else if (localVer !== data.version) {
          localVer = data.version;
          const toast = document.getElementById('lele-update-toast');
          if (toast) {
            toast.innerHTML = `🎉 ${data.msg || "乐乐小导游新任务发布！"} 🎙️ (正在播放 MiMo 语音)`;
            toast.style.display = 'block';
          }
          if (data.audio_url) {
            audioObj.src = data.audio_url + '?_t=' + Date.now();
            audioObj.play().catch(() => {});
          }
          setTimeout(() => { window.location.reload(); }, 2800);
        }
      })
      .catch(() => {});
  }
  setInterval(checkLeleUpdates, 2500);
})();
</script>

<script src="scripts/lele_voice.js?v=2"></script>
</body>
</html>
